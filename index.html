<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#F2FAF6"><title>네가 최고야! — 첫 만남</title><style>
:root{--bg:#F2FAF6;--ink:#246B78;--dark:#1c4249;--sub:#708b88;--line:#dceae6;--green:#2d8278}*{box-sizing:border-box}body{margin:0;background:#e9eeed;color:var(--dark);font-family:ui-rounded,'Apple SD Gothic Neo','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #6ecbb9;outline-offset:3px}.layout{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:70px;padding:25px}.side{width:345px}.side .eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:#5a9b90}.side h1{font-size:37px;line-height:1.24;letter-spacing:-1.8px;margin:16px 0}.side p{font-size:15px;line-height:1.9;color:#667b7c}.side .note{margin-top:22px;padding:17px;border:1px solid #d5e2df;border-radius:17px;background:#fff9;font-size:13px;line-height:1.7;color:#55716c}.phone{width:393px;height:min(852px,calc(100dvh - 30px));min-height:670px;max-height:852px;flex-shrink:0;background:var(--bg);position:relative;overflow:hidden;border-radius:42px;box-shadow:0 22px 75px #40514b2a;border:7px solid #fff}.status{position:absolute;top:0;left:0;right:0;height:52px;padding:15px 26px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:700;z-index:5;color:#182b31}.status .signal{font-size:13px;letter-spacing:2px}.topbar{position:absolute;top:55px;left:21px;right:21px;display:flex;justify-content:space-between;align-items:center;z-index:8}.back,.skip,.sound{border:0;background:transparent;color:#64827d;font-size:13px;padding:10px}.back{font-size:23px}.back:disabled{opacity:0;pointer-events:none}.dots{display:flex;gap:5px}.dots i{height:4px;width:16px;border-radius:6px;background:#d6e6e0}.dots i.on{background:#4e9b8d}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 22px}.copy{position:absolute;top:16%;left:20px;right:20px;z-index:3}.copy h2{margin:0;color:#286b66;font-size:24px;line-height:1.5;letter-spacing:-.9px;font-weight:800;white-space:pre-line}.copy p{margin:12px auto 0;font-size:13px;color:#7a9691;line-height:1.65;white-space:pre-line}.stage{position:absolute;top:30%;bottom:18%;left:0;right:0;display:flex;justify-content:center;align-items:center;pointer-events:none}.character{position:absolute;width:83%;max-height:91%;object-fit:contain;filter:drop-shadow(0 8px 8px #6faca61a);animation:bob 3.8s ease-in-out infinite;transition:transform .45s,opacity .35s;pointer-events:auto;cursor:pointer}.character.pop{animation:pop .6s ease-out}.egg{width:64%;max-height:76%;object-fit:contain;filter:drop-shadow(0 14px 13px #8ab9ae25);pointer-events:auto;cursor:pointer;animation:eggfloat 3s ease-in-out infinite}.egg.shake{animation:shake .65s ease-in-out}.nature{position:absolute;width:98%;height:auto;bottom:6%;left:1%;pointer-events:none;opacity:.96}.hint{position:absolute;bottom:21%;color:#7a9a90;font-size:12px;z-index:4;animation:pulse 2s infinite}.bottom{position:absolute;bottom:25px;left:22px;right:22px;z-index:7;display:flex;flex-direction:column;gap:11px}.pill{border:1px solid #cfe6dd;background:#ffffffd9;color:#376b67;padding:12px 14px;border-radius:17px;font-size:14px;font-weight:700;transition:.2s}.pill:hover{background:#e3f6ed}.choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.choices .pill{flex:1;min-width:40%}.primary{border:0;background:var(--green);color:white;padding:16px;border-radius:18px;font-size:15px;font-weight:800;box-shadow:0 6px 16px #2d827826}.primary:disabled{background:#b6d0c8;box-shadow:none}.secondary{border:0;background:transparent;color:#77938b;font-size:12px;padding:6px}.inputrow{display:flex;gap:8px;background:white;border:1px solid #d7eae3;border-radius:18px;padding:6px}.inputrow input{min-width:0;flex:1;border:0;background:transparent;padding:10px 11px;outline:none;color:#275d59;font-size:15px}.inputrow button{border:0;background:#e4f4ec;color:#277366;border-radius:12px;padding:0 16px;font-weight:800}.mic{width:58px;height:58px;border-radius:50%;border:0;background:#fff;color:#2b8275;box-shadow:0 7px 25px #3b897323;font-size:23px;align-self:center}.mic.active{background:#2d8278;color:#fff;animation:pulse 1s infinite}.miclabel{font-size:12px;color:#79968e}.response{border-radius:19px;background:#fffdf0;border:1px solid #e8e9c9;padding:12px 15px;font-size:13px;line-height:1.6;color:#4f7167}.homehead{position:absolute;top:80px;left:26px;right:26px;text-align:left}.homehead .label{font-size:12px;color:#7c9a91}.homehead h2{font-size:25px;color:#286b66;margin:6px 0}.home-card{position:absolute;bottom:30px;left:20px;right:20px;text-align:left;background:#fff;border:1px solid #e0ede6;border-radius:22px;padding:17px;box-shadow:0 8px 24px #62948810}.home-card b{font-size:14px}.home-card p{font-size:12px;line-height:1.6;color:#728b84}.home-card .primary{width:100%;margin-top:5px}.tiny{font-size:11px;color:#91aaa1}.toast{position:absolute;top:105px;left:40px;right:40px;padding:11px 14px;background:#2b6d64;color:white;border-radius:14px;font-size:12px;z-index:20;opacity:0;transform:translateY(-8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes eggfloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-11deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(5deg)}}@keyframes pop{0%{transform:scale(.7);opacity:.2}65%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}@keyframes pulse{50%{opacity:.55}}@media(max-width:850px){.layout{padding:0}.side{display:none}.phone{border:0;border-radius:0;width:100vw;height:100dvh;min-height:0;max-height:none;box-shadow:none}.copy{top:16%}.stage{top:29%;bottom:16%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div class="layout"><aside class="side"><div class="eyebrow">UX ONBOARDING · INTERACTIVE PROTOTYPE</div><h1>네가 최고야!<br>처음 만나는 순간</h1><p>입력 폼을 채우는 대신, 작은 친구와의 대화로 시작하는 영어 학습 온보딩.<br><br>알을 터치해 첫 만남을 시작하고, 이름과 학습 목적을 자연스럽게 알려준 뒤 첫 영어 발화까지 경험해 보세요.</p><div class="note">✓ 알 발견 → 부화 → 인사 → 이름 → 목적 → 첫 영어 대화 → 홈<br>✓ 마이크 또는 텍스트 입력 선택 가능<br>✓ 단계 건너뛰기 · 수정 · 재시작 가능<br>✓ 음성 기능은 지원 브라우저에서만 작동</div></aside><main class="phone" aria-label="온보딩 앱 데모"><div class="status"><span>9:41</span><span class="signal">●●● ▰</span></div><div class="topbar"><button class="back" id="back" aria-label="이전 단계">‹</button><div class="dots" id="dots"></div><button class="skip" id="skip">건너뛰기</button></div><div class="screen" id="screen"></div><div class="toast" id="toast" role="status"></div></main></div><script>
const $=s=>document.querySelector(s), screen=$('#screen');const assets={hello:'img/hello.png',happy:'img/happy.png',thinking:'img/thinking.png',shy:'img/shy.png',excited:'img/excited.png',egg:'img/egg.png',nature:'img/nature.png'};const defaults={step:0,name:'',goal:'',level:'',answer:'',firstDone:false};let data={...defaults,...JSON.parse(localStorage.getItem('bestFriendDemo')||'{}')};let voiceEnabled=true,recognition=null,speeching=false,eggTaps=0;const total=7;function save(){localStorage.setItem('bestFriendDemo',JSON.stringify(data))}function go(s){data.step=Math.max(0,Math.min(7,s));save();render()}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2500)}function say(t,lang='ko-KR'){if(!voiceEnabled||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=lang==='en-US'?.88:1.04;u.pitch=1.15;speechSynthesis.speak(u)}function listen(lang,callback){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('이 브라우저는 음성 인식을 지원하지 않아요. 글자로 입력해 주세요.');return}try{recognition?.abort();recognition=new SR();recognition.lang=lang;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{callback(e.results[0][0].transcript)};recognition.onerror=e=>toast(e.error==='not-allowed'?'마이크 권한을 확인해 주세요.':'음성을 듣지 못했어요. 다시 시도해 주세요.');recognition.onend=()=>document.querySelector('.mic')?.classList.remove('active');recognition.start();document.querySelector('.mic')?.classList.add('active')}catch(e){toast('마이크를 시작하지 못했어요. 텍스트 입력을 이용해 주세요.')}}function char(kind='hello',tap){return `<img class="character" id="char" src="${assets[kind]}" alt="민트색과 파란색 털을 가진 귀여운 몬스터 친구" ${tap?'role="button" tabindex="0"':''}>`}function scene(kind='hello',nature=true){return `<div class="stage">${char(kind,true)}${nature?`<img class="nature" src="${assets.nature}" alt="">`:''}</div>`}function copy(title,desc=''){return `<div class="copy"><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>`}function bottom(html){return `<div class="bottom">${html}</div>`}function primary(text,fn){return `<button class="primary" onclick="${fn}">${text}</button>`}function input(placeholder,fn,lang='ko-KR'){return `<div class="inputrow"><input id="reply" placeholder="${placeholder}" aria-label="답변 입력" maxlength="80"><button onclick="${fn}">확인</button></div><button class="mic" id="mic" aria-label="말로 답하기">🎙</button><span class="miclabel">마이크를 누르거나 직접 입력할 수 있어요</span>`}function answerName(v){v=(v||'').trim();if(!v)return toast('이름이나 별명을 알려줘!');data.name=v.slice(0,20);save();say(`${data.name}, 만나서 반가워!`);go(3)}function answerGoal(v){data.goal=v;save();say('좋아! 우리 같이 해보자.');go(4)}function answerLevel(v){data.level=v;save();go(5)}function question(){return data.goal==='여행'?'You are at a café. What would you like to drink?':data.goal==='일상 대화'?'What do you like to do on weekends?':data.goal==='업무'?'Can you tell me a little about your work?':'What made you want to learn English?'}function reply(v){v=(v||'').trim();if(!v)return toast('짧게라도 이야기해 줘!');data.answer=v;data.firstDone=true;save();say('That was great! We can practice together.', 'en-US');go(6)}function finish(){go(7);say(`${data.name||'친구'}야, 내일도 같이 이야기하자!`)}function render(){let s=data.step;$('#back').disabled=s===0;$('#skip').textContent=s===7?'처음부터':s===0?'소리 끄기':s===6?'홈으로':'건너뛰기';$('#dots').innerHTML=Array.from({length:6},(_,i)=>`<i class="${s>0&&i<=Math.min(s-1,5)?'on':''}"></i>`).join('');let h='';if(s===0){h=copy('어라, 이건 뭐지?','살짝 건드려 볼까?')+`<div class="stage"><img id="egg" class="egg" src="${assets.egg}" alt="금이 가지 않은 민트 블루색 알" role="button" tabindex="0"><img class="nature" src="${assets.nature}" alt="풀과 작은 돌"></div><div class="hint">알을 톡톡 눌러줘 · ${eggTaps}/2</div>`+bottom(primary('알 만져보기','tapEgg()'))}else if(s===1){h=copy('안녕!','너를 만나려고 기다렸어')+scene('excited')+bottom(primary('안녕, 반가워!','greet()')+`<button class="secondary" onclick="greet()">친구에게 인사하기</button>`)}else if(s===2){h=copy('너를 뭐라고 부르면 될까?','이름도 좋고, 별명도 좋아')+scene('hello')+bottom(input('이름 또는 별명','answerName(document.querySelector("#reply").value)'))}else if(s===3){h=copy(`${esc(data.name||'친구')}야, 반가워!\n영어로 뭘 해보고 싶어?`,'하나만 골라줘. 나중에 바꿀 수 있어')+scene('thinking')+bottom(`<div class="choices"><button class="pill" onclick="answerGoal('여행')">✈️ 여행에서 말하기</button><button class="pill" onclick="answerGoal('일상 대화')">💬 일상 대화하기</button><button class="pill" onclick="answerGoal('업무')">💼 업무에 활용하기</button><button class="pill" onclick="answerGoal('그냥 재미로')">✨ 그냥 재미로</button></div>`)}else if(s===4){h=copy('우리, 어느 정도부터\n시작하면 좋을까?','잘 몰라도 괜찮아. 대화하면서 맞춰갈게')+scene('shy')+bottom(`<div class="choices"><button class="pill" onclick="answerLevel('처음')">🌱 이제 막 시작해</button><button class="pill" onclick="answerLevel('조금')">🌿 조금은 말할 수 있어</button><button class="pill" onclick="answerLevel('자유')">🌳 대화해 본 적 있어</button><button class="pill" onclick="answerLevel('모름')">🤍 잘 모르겠어</button></div>`)}else if(s===5){h=copy('그럼, 우리 영어로\n딱 한마디만 해볼까?','틀려도 괜찮아. 그냥 이야기해 줘')+scene('hello')+bottom(`<div class="response" id="q">${esc(question())}</div><button class="secondary" onclick="say(question(),'en-US')">🔊 질문 다시 듣기</button>`+input('영어로 자유롭게 답하기','reply(document.querySelector("#reply").value)','en-US'))}else if(s===6){h=copy('우와, 방금 영어로\n이야기했어!','오늘 첫 번째 대화 성공 🎉')+scene('happy')+bottom(`<div class="response">${data.firstDone?'“'+esc(data.answer)+'”':'지금부터 천천히 시작해도 괜찮아!'}</div>`+primary('우리의 공간으로 가기','finish()'))}else{h=`<div class="homehead"><span class="label">오늘도 반가워 👋</span><h2>${esc(data.name||'친구')}야, 안녕!</h2><span class="tiny">친구를 톡 눌러봐</span></div>`+scene('hello')+`<div class="home-card"><b>오늘의 작은 대화 💬</b><p>${data.firstDone?'첫 영어 대화를 마쳤어. 오늘은 한 문장만 더 해볼까?':'부담 없이 한마디부터 시작해 보자.'}</p>`+primary('친구와 영어로 이야기하기','practice()')+`<button class="secondary" style="width:100%" onclick="reset()">처음부터 다시 체험하기</button></div>`}screen.innerHTML=h;let c=$('#char');if(c){c.addEventListener('click',()=>{c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');if(s===7){say(`${data.name||'친구'}야, 오늘은 어떤 하루였어?`);toast('친구가 반갑게 인사했어!')}else if(s===1)greet();else if(s===5)say(question(),'en-US');else say('헤헤, 간지러워!')});c.addEventListener('keydown',e=>{if(e.key==='Enter')c.click()})}if(s===0){$('#egg').onclick=tapEgg;$('#egg').onkeydown=e=>{if(e.key==='Enter')tapEgg()}}if(s===2||s===5){let field=$('#reply');field.addEventListener('keydown',e=>{if(e.key==='Enter'){s===2?answerName(field.value):reply(field.value)}});$('#mic').onclick=()=>listen(s===2?'ko-KR':'en-US',v=>{field.value=v;s===2?answerName(v):reply(v)})}if(s===1)setTimeout(()=>{if(data.step===1)say('안녕! 드디어 만났네!')},350);if(s===5)setTimeout(()=>{if(data.step===5)say(question(),'en-US')},400)}function tapEgg(){eggTaps++;if(eggTaps>=2){eggTaps=0;go(1)}else{$('#egg').classList.add('shake');$('.hint').textContent='어? 알이 움직였어! 한 번 더 톡!';setTimeout(()=>$('#egg')?.classList.remove('shake'),700)}}function greet(){say('우리 친해지자! 이름이 뭐야?');go(2)}function practice(){go(5)}function reset(){data={...defaults};eggTaps=0;save();render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('#back').onclick=()=>go(data.step===7?6:data.step-1);$('#skip').onclick=()=>{if(data.step===7)return reset();if(data.step===0){voiceEnabled=!voiceEnabled;toast(voiceEnabled?'소리가 켜졌어':'소리가 꺼졌어');return}if(data.step===6)return finish();if(data.step===2&&!data.name)data.name='친구';if(data.step===3&&!data.goal)data.goal='일상 대화';if(data.step===4&&!data.level)data.level='모름';go(data.step+1)};render();
</script></body></html>
