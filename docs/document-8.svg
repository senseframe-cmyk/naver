<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="8장  검증 계획과 다음 아이디어" style="font-family:Pretendard,Apple SD Gothic Neo,sans-serif"><rect x="0" y="0" width="2048" height="1152" rx="0" fill="#fff" /><image href="img/naver-logo.png" x="1861" y="58" width="94" height="19" /><text x="92" y="80" fill="#202b35" font-size="40" font-weight="700"><tspan x="92" dy="0">8장  검증 계획과 다음 아이디어</tspan></text><path d="M89 103 H1958" stroke="#c9d2d9" stroke-width="1.6" /><text x="92" y="147" fill="#63717c" font-size="28" font-weight="400"><tspan x="92" dy="0">온보딩 1~7번에서 첫 영어 발화를 경험하고 8번 홈에서 다음 대화로 연결합니다</tspan></text><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><rect x="92" y="195" width="1864" height="390" rx="10" fill="#f5f5f7" /><text x="122" y="240" fill="#111111" font-size="24" font-weight="700"><tspan x="122" dy="0">가설 → 관찰할 행동 → 다음 결정</tspan></text><text x="122" y="294" fill="#111111" font-size="22" font-weight="400"><tspan x="122" dy="0">① 관계 형성이 첫 발화를 돕는가?  |  성인 초급 / 재시작 학습자 5~8명 대상 탐색 테스트 계획</tspan><tspan x="122" dy="40">    질문과 조작은 같게 두고 캐릭터 반응 유무에 따른 망설임 / 입력 완료 / 부담감 관찰</tspan><tspan x="122" dy="40">② 필요한 정보를 포기하지 않고 입력하는가?  |  이름 응답 / 목적 선택 / 수준 선택별 완료와 건너뛰기 기록</tspan><tspan x="122" dy="40">    권한 이탈 / 첫 영어 발화까지 시간 / 실패 후 재시도 관찰 후 단계 축약과 대안 입력의 우선순위 결정</tspan><tspan x="122" dy="40">③ 첫 발화가 다음 대화로 이어지는가?  |  홈에서 다음 대화 시작과 재방문을 후속 비교 실험으로 확인</tspan><tspan x="122" dy="40">    돌봄 보상은 확장 구상 / 소규모 사용성 결과를 지속 사용이나 인과 효과의 증거로 해석하지 않음</tspan></text><rect x="92" y="625" width="909" height="420" rx="10" fill="#f5f5f7" /><text x="122" y="671" fill="#111111" font-size="24" font-weight="700"><tspan x="122" dy="0">다음 구현 · 접근성과 신뢰</tspan></text><text x="122" y="722" fill="#111111" font-size="22" font-weight="400"><tspan x="122" dy="0">• 이름 / 목적 / 수준 중 첫 이용에 꼭 필요한 항목 재검토</tspan><tspan x="122" dy="42">• 인식 오류 / 권한 거부 / 미지원 환경의 입력 대안 보완</tspan><tspan x="122" dy="42">• 수집 정보의 목적과 음성 처리 범위를 명확히 안내</tspan><tspan x="122" dy="42">• 키보드 / 스크린리더 / 모션 줄이기 실제 기기 검수</tspan><tspan x="122" dy="42">• 인식된 이름의 확인과 수정 경로 보완</tspan><tspan x="122" dy="42">현재: 브라우저 음성 인식 / 규칙 기반 응답 데모</tspan></text><rect x="1046" y="625" width="909" height="420" rx="10" fill="#f5f5f7" /><text x="1076" y="671" fill="#111111" font-size="24" font-weight="700"><tspan x="1076" dy="0">유지한 익숙함 · 다음 확장</tspan></text><text x="1076" y="722" fill="#111111" font-size="22" font-weight="400"><tspan x="1076" dy="0">• 유지: 시작 / 이전 / 건너뛰기 / 2×2 선택지</tspan><tspan x="1076" dy="42">• 유지: 누르고 말하기 / 다시 듣기 / 재시도</tspan><tspan x="1076" dy="42">• 변경: 설문 입력을 친구와의 문답으로 연결</tspan><tspan x="1076" dy="42">• 변경: 듣기와 실패 상태를 표정과 문구로 전달</tspan><tspan x="1076" dy="42">• 확장: 시간 / 주제별 공간과 대화 보상으로 돌봄</tspan><tspan x="1076" dy="42">검증 기준: 필수 정보 입력과 첫 영어 발화의 완료</tspan></text></svg>