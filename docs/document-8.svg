<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="8장  검증 계획과 다음 아이디어" style="font-family:Pretendard,Apple SD Gothic Neo,sans-serif"><rect x="0" y="0" width="2048" height="1152" rx="0" fill="#fff" /><image href="img/naver-logo.png" x="1861" y="58" width="94" height="19" /><text x="92" y="80" fill="#202b35" font-size="40" font-weight="700"><tspan x="92" dy="0">8장  검증 계획과 다음 아이디어</tspan></text><path d="M89 103 H1958" stroke="#c9d2d9" stroke-width="1.6" /><text x="92" y="147" fill="#63717c" font-size="28" font-weight="400"><tspan x="92" dy="0">현재 구현한 것과 앞으로 확인할 것을 나누어 정리했습니다.</tspan></text><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><rect x="92" y="195" width="1864" height="390" rx="10" fill="#f5f5f7" /><text x="122" y="240" fill="#215e50" font-size="30" font-weight="600"><tspan x="122" dy="0">가설 → 관찰할 행동 → 다음 결정</tspan></text><text x="122" y="294" fill="#215e50" font-size="25" font-weight="400"><tspan x="122" dy="0">① 캐릭터가 부담을 낮추는가?  |  성인 초급·재시작 학습자 5~8명 탐색 인터뷰·사용성 테스트.</tspan><tspan x="122" dy="43">    알·캐릭터형과 단순 대화형을 비교해 망설임·도움 요청·부담을 관찰. 인과 효과는 후속 검증.</tspan><tspan x="122" dy="43">② 흐름이 너무 긴가?  |  단계별 진입·완료·건너뛰기·재시도 이벤트와 첫 영어 발화까지 시간 측정.</tspan><tspan x="122" dy="43">    첫 영어 완료율·권한 이탈률·재시도 성공률을 측정. 7단계와 축약 흐름을 비교해 불필요한 단계 축소.</tspan><tspan x="122" dy="43">③ 보상이 말하기를 이어주는가?  |  포인트 노출 유무에 따른 다음 영어 대화 시작·다음 날 복귀 비교.</tspan><tspan x="122" dy="43">    소규모 탐색 결과를 효과 확정으로 해석하지 않고, 충분한 표본의 후속 비교 실험으로 검증.</tspan></text><rect x="92" y="625" width="909" height="420" rx="10" fill="#f5f5f7" /><text x="122" y="671" fill="#215e50" font-size="29" font-weight="600"><tspan x="122" dy="0">다음 구현 · 접근성과 신뢰</tspan></text><text x="122" y="722" fill="#215e50" font-size="24" font-weight="400"><tspan x="122" dy="0">• 한국어·영어 오인식, 권한 거부, 미지원 환경의 대안 입력.</tspan><tspan x="122" dy="47">• 보상은 실제 영어 대화 완료 이벤트에 연결하고 중복 방지.</tspan><tspan x="122" dy="47">• 원음 보관 여부·삭제·동의·보유 기간을 명확히 안내.</tspan><tspan x="122" dy="47">• 스크린리더 레이블, 모션 줄이기, 키보드 입력 경로 점검.</tspan><tspan x="122" dy="47">• 이름은 다시 말해 수정 가능하게 하고 과도한 의인화 방지.</tspan><tspan x="122" dy="47">현재: 브라우저 인식·규칙 기반 응답·기기 내 저장 데모.</tspan></text><rect x="1046" y="625" width="909" height="420" rx="10" fill="#f5f5f7" /><text x="1076" y="671" fill="#215e50" font-size="29" font-weight="600"><tspan x="1076" dy="0">유지한 익숙함 · 다음 확장</tspan></text><text x="1076" y="722" fill="#215e50" font-size="24" font-weight="400"><tspan x="1076" dy="0">• 이전·건너뛰기로 순서를 되돌리거나 선택을 미룸.</tspan><tspan x="1076" dy="47">• 2×2 선택지로 긴 답변 대신 익숙한 상황을 고름.</tspan><tspan x="1076" dy="47">• 누르고 말하기·다시 듣기·재시도로 조작을 반복.</tspan><tspan x="1076" dy="47">• 바꾼 것: 설문 중심의 시작을 캐릭터 대화로 전환.</tspan><tspan x="1076" dy="47">• 다음 확장: 주제 추천·난이도 조정·포인트로 돌봄.</tspan><tspan x="1076" dy="47">유지한 조작의 이해도와 7단계 길이를 함께 검증.</tspan></text></svg>