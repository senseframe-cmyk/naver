<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="7장  레퍼런스와 설계 근거" style="font-family:Pretendard,Apple SD Gothic Neo,sans-serif"><rect x="0" y="0" width="2048" height="1152" rx="0" fill="#fff" /><image href="img/naver-logo.png" x="1861" y="58" width="94" height="19" /><text x="92" y="80" fill="#202b35" font-size="40" font-weight="700"><tspan x="92" dy="0">7장  레퍼런스와 설계 근거</tspan></text><path d="M89 103 H1958" stroke="#c9d2d9" stroke-width="1.6" /><text x="92" y="147" fill="#63717c" font-size="28" font-weight="400"><tspan x="92" dy="0">공개 연구를 참고했습니다. 서비스와 사용자에 대한 해석은 별도 가설로 구분했습니다.</tspan></text><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><rect x="92" y="200" width="1864" height="260" rx="10" fill="#f5f5f7" /><text x="122" y="243" fill="#215e50" font-size="28" font-weight="600"><tspan x="122" dy="0">01  온라인에서도 말하기 불안은 남아 있음</tspan></text><text x="122" y="282" fill="#215e50" font-size="22" font-weight="400"><tspan x="122" dy="0">Bárkányi &amp; Brash · ReCALL · 2025</tspan></text><text x="122" y="323" fill="#215e50" font-size="23" font-weight="400"><tspan x="122" dy="0">성인 온라인 언어 학습자 307명 설문과 10명 인터뷰. 녹음·평가에 대한 불안도 보고됨.</tspan><tspan x="122" dy="34">적용: 쉬운 첫 문장, 틀려도 괜찮다는 안내, 듣기·실패 상태의 명확한 피드백.</tspan><tspan x="122" dy="34">한계: 영국 원격대학 맥락. 국내 20~30대와 Montalk의 효과로 일반화할 수 없음.</tspan></text><a href="https://doi.org/10.1017/S0958344025000060" target="_blank" rel="noopener noreferrer"><text x="122" y="436" fill="#215e50" font-size="21" font-weight="400"><tspan x="122" dy="0">🔗 : 링크</tspan></text><path d="M122 441h90" stroke="#215e50" /></a><rect x="92" y="482" width="1864" height="260" rx="10" fill="#f5f5f7" /><text x="122" y="525" fill="#215e50" font-size="28" font-weight="600"><tspan x="122" dy="0">02  AI 대화의 가능성, 캐릭터 효과는 아직 가설</tspan></text><text x="122" y="564" fill="#215e50" font-size="22" font-weight="400"><tspan x="122" dy="0">Kim &amp; Su · System · 2024</tspan></text><text x="122" y="605" fill="#215e50" font-size="23" font-weight="400"><tspan x="122" dy="0">한국어 외국어 학습자의 AI 챗봇 사용과 의사소통 의지·불안·자신감을 살핀 연구.</tspan><tspan x="122" dy="34">적용: 사람 앞에서 평가받기 전, 작은 AI 친구에게 안전하게 말해보는 경험을 제안.</tspan><tspan x="122" dy="34">한계: 연구 언어·집단이 다름. 몬스터·보상·온보딩 완료율의 인과 근거는 아님.</tspan></text><a href="https://www.sciencedirect.com/science/article/pii/S0346251X24000381" target="_blank" rel="noopener noreferrer"><text x="122" y="718" fill="#215e50" font-size="21" font-weight="400"><tspan x="122" dy="0">🔗 : 링크</tspan></text><path d="M122 723h90" stroke="#215e50" /></a><rect x="92" y="764" width="1864" height="260" rx="10" fill="#f5f5f7" /><text x="122" y="807" fill="#215e50" font-size="28" font-weight="600"><tspan x="122" dy="0">03  수준에 맞는 언어와 검증의 필요성</tspan></text><text x="122" y="846" fill="#215e50" font-size="22" font-weight="400"><tspan x="122" dy="0">Rajaratnam, Gan &amp; Sun · EDULEARN26 · 2026</tspan></text><text x="122" y="887" fill="#215e50" font-size="23" font-weight="400"><tspan x="122" dy="0">수준에 맞는 대화 생성과 소규모 파일럿을 연구. 말하기 불안 감소는 통계적으로 확인되지 않음.</tspan><tspan x="122" dy="34">적용: 자기보고 수준은 출발점으로만 활용하고 실제 대화에서 난이도를 조정할 계획.</tspan><tspan x="122" dy="34">한계: 소규모 연구. 난이도 조정이 불안을 반드시 낮춘다고 주장하지 않음.</tspan></text><a href="https://arxiv.org/abs/2607.21887" target="_blank" rel="noopener noreferrer"><text x="122" y="1000" fill="#215e50" font-size="21" font-weight="400"><tspan x="122" dy="0">🔗 : 링크</tspan></text><path d="M122 1005h90" stroke="#215e50" /></a></svg>