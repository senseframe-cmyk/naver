<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="7장  레퍼런스와 설계 근거" style="font-family:Pretendard,Apple SD Gothic Neo,sans-serif"><rect x="0" y="0" width="2048" height="1152" rx="0" fill="#fff" /><image href="img/naver-logo.png" x="1861" y="58" width="94" height="19" /><text x="92" y="80" fill="#202b35" font-size="40" font-weight="700"><tspan x="92" dy="0">7장  레퍼런스와 설계 근거</tspan></text><path d="M89 103 H1958" stroke="#c9d2d9" stroke-width="1.6" /><text x="92" y="147" fill="#63717c" font-size="28" font-weight="400"><tspan x="92" dy="0">공개 연구와 UX 가이드를 설계에 참고했습니다 / 캐릭터의 효과와 지속 사용은 검증할 가설입니다</tspan></text><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><rect x="92" y="200" width="1864" height="260" rx="10" fill="#f5f5f7" /><text x="122" y="243" fill="#111111" font-size="24" font-weight="700"><tspan x="122" dy="0">01  말하기 불안을 고려한 첫마디</tspan></text><text x="122" y="282" fill="#111111" font-size="20" font-weight="400"><tspan x="122" dy="0">Bárkányi &amp; Brash · ReCALL · 2025</tspan></text><text x="122" y="323" fill="#111111" font-size="22">•</text><text x="122" y="357" fill="#111111" font-size="22">•</text><text x="122" y="391" fill="#111111" font-size="22">•</text><text x="122" y="323" fill="#111111" font-size="22" font-weight="400"><tspan x="146" dy="0">영국 온라인 언어 학습자 307명 설문과 10명 인터뷰에서 말하기 불안을 조사</tspan><tspan x="146" dy="34">설계 해석: 쉬운 첫 문장 / 듣기 상태 안내 / 책임을 돌리지 않는 재시도 피드백</tspan><tspan x="146" dy="34">한계: 국내 초급 학습자의 특성이나 Montalk의 효과를 직접 입증한 연구는 아님</tspan></text><a href="https://doi.org/10.1017/S0958344025000060" target="_blank" rel="noopener noreferrer"><text x="122" y="436" fill="#111111" font-size="20" font-weight="400"><tspan x="122" dy="0">🔗 : <tspan text-decoration="underline">링크</tspan></tspan></text></a><rect x="92" y="482" width="1864" height="260" rx="10" fill="#f5f5f7" /><text x="122" y="525" fill="#111111" font-size="24" font-weight="700"><tspan x="122" dy="0">02  AI 대화의 가능성과 캐릭터 효과의 구분</tspan></text><text x="122" y="564" fill="#111111" font-size="20" font-weight="400"><tspan x="122" dy="0">Kim &amp; Su · System · 2024</tspan></text><text x="122" y="605" fill="#111111" font-size="22">•</text><text x="122" y="639" fill="#111111" font-size="22">•</text><text x="122" y="673" fill="#111111" font-size="22">•</text><text x="122" y="605" fill="#111111" font-size="22" font-weight="400"><tspan x="146" dy="0">한국어 학습자 65명 대상 연구에서 AI 대화 후 참여 의지와 불안의 개선을 보고</tspan><tspan x="146" dy="34">설계 해석: 평가에 앞서 편안하게 한마디를 시도하는 대화 상대를 제안</tspan><tspan x="146" dy="34">한계: 수업 맥락의 연구 / 캐릭터 관계 형성과 온보딩 완료율은 별도 검증 필요</tspan></text><a href="https://doi.org/10.1016/j.system.2024.103256" target="_blank" rel="noopener noreferrer"><text x="122" y="718" fill="#111111" font-size="20" font-weight="400"><tspan x="122" dy="0">🔗 : <tspan text-decoration="underline">링크</tspan></tspan></text></a><rect x="92" y="764" width="1864" height="260" rx="10" fill="#f5f5f7" /><text x="122" y="807" fill="#111111" font-size="24" font-weight="700"><tspan x="122" dy="0">03  설명을 기억하기보다 행동하며 익히기</tspan></text><text x="122" y="846" fill="#111111" font-size="20" font-weight="400"><tspan x="122" dy="0">Nielsen Norman Group / Onboarding Tutorials vs. Contextual Help</tspan></text><text x="122" y="887" fill="#111111" font-size="22">•</text><text x="122" y="921" fill="#111111" font-size="22">•</text><text x="122" y="955" fill="#111111" font-size="22">•</text><text x="122" y="887" fill="#111111" font-size="22" font-weight="400"><tspan x="146" dy="0">사용 맥락에서 바로 적용할 수 있는 안내를 권장하는 UX 가이드</tspan><tspan x="146" dy="34">설계 해석: 망설일 때 버튼을 가리키고 / 말할 때 다가와 듣는 반응으로 조작 안내</tspan><tspan x="146" dy="34">한계: 캐릭터 안내의 우월성은 입증되지 않음 / 무안내 조건과 이해도 비교 필요</tspan></text><a href="https://www.nngroup.com/articles/onboarding-tutorials/" target="_blank" rel="noopener noreferrer"><text x="122" y="1000" fill="#111111" font-size="20" font-weight="400"><tspan x="122" dy="0">🔗 : <tspan text-decoration="underline">링크</tspan></tspan></text></a></svg>