<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="2장  사용자와 문제" style="font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><rect x="0" y="0" width="2048" height="1152" fill="#fff"/><image href="img/naver-logo.png" x="1861" y="58" width="94" height="19" preserveAspectRatio="xMidYMid meet"/><text x="92" y="80" fill="#202b35" font-size="40" font-weight="700"><tspan x="92" dy="0">2장  사용자와 문제</tspan></text><path d="M89 103 H1958" stroke="#c9d2d9" stroke-width="1.6"/><rect x="92" y="150" width="909" height="493" fill="#f5f5f7"/><text x="138" y="220" fill="#202b35" font-size="34" font-weight="700"><tspan x="138" dy="0">사용자 그룹</tspan></text><text x="138" y="269" fill="#63717c" font-size="22" font-weight="400"><tspan x="138" dy="0">누구인지 떠올릴 수 있게 구체적으로 적어 주세요.</tspan><tspan x="138" dy="32">나이대, 상황, 사용 기기처럼 설계에 영향을 주는 특징도 함께 적어 주세요.</tspan></text><rect x="1046" y="150" width="909" height="493" fill="#f5f5f7"/><text x="1092" y="220" fill="#202b35" font-size="34" font-weight="700"><tspan x="1092" dy="0">문제</tspan></text><text x="1092" y="269" fill="#63717c" font-size="22" font-weight="400"><tspan x="1092" dy="0">이 사용자의 어떤 순간이 왜 잘되지 않는지 적어 주세요.</tspan><tspan x="1092" dy="32">고른 주제(온보딩, 루틴과 알림, 예약)와 관련된 문제를 한두 가지로 좁혀 주세요.</tspan></text><rect x="92" y="690" width="1864" height="356" fill="#f5f5f7"/><text x="138" y="772" fill="#202b35" font-size="34" font-weight="700"><tspan x="138" dy="0">그렇게 판단한 근거</tspan></text><text x="138" y="820" fill="#63717c" font-size="22" font-weight="400"><tspan x="138" dy="0">관찰, 자료, 경험 가운데 무엇을 근거로 삼았는지 적어 주세요. 확인하지 못한 내용은 &#x27;예상&#x27;이라고 표시해 주세요.</tspan></text><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><text x="138" y="365" fill="#215e50" font-size="26" font-weight="400"><tspan x="138" dy="0">대상 가설: 영어 지식은 있지만 말하기가 부담스러운</tspan><tspan x="138" dy="44">20~30대 성인 초급·재시작 학습자.</tspan><tspan x="138" dy="44">출퇴근 전후, 집처럼 혼자 말할 수 있는 장소에서</tspan><tspan x="138" dy="44">모바일로 짧게 연습하고 싶지만 첫 발화를 미룸.</tspan></text><text x="138" y="565" fill="#215e50" font-size="23" font-weight="400"><tspan x="138" dy="0">사용자 인터뷰 전 가설이며, 연령·상황은 검증 예정.</tspan></text><text x="1092" y="365" fill="#215e50" font-size="26" font-weight="400"><tspan x="1092" dy="0">문제 1. 시작 전 정보 입력·수준 평가가 길어지면</tspan><tspan x="1092" dy="44">대화의 가치를 느끼기 전에 부담이 커질 수 있음.</tspan><tspan x="1092" dy="44">문제 2. 발음·정답에 대한 걱정과 음성 인식 실패가</tspan><tspan x="1092" dy="44">첫 영어 발화를 중단하게 만들 수 있음.</tspan></text><text x="1092" y="565" fill="#215e50" font-size="25" font-weight="600"><tspan x="1092" dy="0">목표: 설정 완료보다 첫 영어 발화의 경험을 우선.</tspan></text><text x="138" y="884" fill="#215e50" font-size="25" font-weight="400"><tspan x="138" dy="0">[1] 온라인 언어 학습자 307명 조사: 녹음 활동에도 말하기 불안이 나타남.</tspan><tspan x="138" dy="43">해석: 기술 사용 자체도 부담이 될 수 있어, 재시도와 권한 안내가 필요함.</tspan><tspan x="138" dy="43">[2] AI 대화 연구는 발화 의지·불안을 살핌. 몬스터와 보상의 효과는 별도 검증할 가설.</tspan></text><text x="138" y="1022" fill="#215e50" font-size="23" font-weight="600"><tspan x="138" dy="0">출처와 적용 한계 → 7장  |  사용자 인터뷰·완료율 측정 계획 → 8장</tspan></text></svg>