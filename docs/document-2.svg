<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="2장  사용자와 문제" style="font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><rect x="0" y="0" width="2048" height="1152" fill="#fff"/><image href="img/naver-logo.png" x="1861" y="58" width="94" height="19" preserveAspectRatio="xMidYMid meet"/><path d="M89 103 H1958" stroke="#c9d2d9" stroke-width="1.6"/><rect x="92" y="150" width="909" height="493" fill="#f5f5f7"/><rect x="1046" y="150" width="909" height="493" fill="#f5f5f7"/><rect x="92" y="690" width="1864" height="356" fill="#f5f5f7"/><text x="92" y="80" fill="#202b35" font-size="40" font-weight="700"><tspan x="92" dy="0">2장  사용자와 문제</tspan></text><text x="138" y="220" fill="#202b35" font-size="34" font-weight="700"><tspan x="138" dy="0">사용자 그룹</tspan></text><text x="1092" y="220" fill="#202b35" font-size="34" font-weight="700"><tspan x="1092" dy="0">문제</tspan></text><text x="138" y="772" fill="#202b35" font-size="34" font-weight="700"><tspan x="138" dy="0">그렇게 판단한 근거</tspan></text><text x="138" y="273" fill="#111111" font-size="22" font-weight="700"><tspan x="138" dy="0">사용자 특성 / 설계 대상 가설</tspan></text><text x="138" y="305" fill="#111111" font-size="22" font-weight="400"><tspan x="138" dy="0">기본적인 영어 지식은 있지만 말하기에 자신이 없는</tspan><tspan x="138" dy="32">20~30대 성인 초급 / 재시작 학습자를 설계 대상으로 설정</tspan></text><text x="138" y="395" fill="#111111" font-size="22" font-weight="700"><tspan x="138" dy="0">이용 환경</tspan></text><text x="138" y="427" fill="#111111" font-size="22" font-weight="400"><tspan x="138" dy="0">집이나 조용한 공간에서 짧게 영어회화를 연습하고,</tspan><tspan x="138" dy="32">타인의 시선 없이 첫마디를 시작하고 싶은 상황을 가정</tspan></text><text x="138" y="517" fill="#111111" font-size="22" font-weight="700"><tspan x="138" dy="0">첫 이용의 장벽 / 검증할 문제</tspan></text><text x="138" y="549" fill="#111111" font-size="22" font-weight="400"><tspan x="138" dy="0">무엇을 눌러야 할지 망설이거나 평가를 걱정하는 순간과</tspan><tspan x="138" dy="32">음성 인식 실패 이후 포기하는 지점을 우선 확인할 계획</tspan></text><text x="1092" y="273" fill="#111111" font-size="22" font-weight="700"><tspan x="1092" dy="0">문제 1 / 실제 이용과 분리된 정보 입력</tspan></text><text x="1092" y="305" fill="#111111" font-size="22" font-weight="400"><tspan x="1092" dy="0">설문형 설정을 마쳐야 대화를 시작하는 흐름에서는</tspan><tspan x="1092" dy="32">필수 정보를 입력하는 이유와 실제 이용 방식의 연결이 약함</tspan></text><text x="1092" y="395" fill="#111111" font-size="22" font-weight="700"><tspan x="1092" dy="0">문제 2 / 말하기와 재시도의 부담</tspan></text><text x="1092" y="427" fill="#111111" font-size="22" font-weight="400"><tspan x="1092" dy="0">실수에 대한 걱정과 불분명한 듣기 상태는 발화를 망설이게 함</tspan><tspan x="1092" dy="32">인식 실패를 사용자의 잘못으로 느끼지 않도록 안내할 필요</tspan></text><text x="1092" y="517" fill="#111111" font-size="22" font-weight="700"><tspan x="1092" dy="0">목표</tspan></text><text x="1092" y="549" fill="#111111" font-size="22" font-weight="700"><tspan x="1092" dy="0">익숙한 조작은 유지하고 정보 입력을 친구와의 대화로 전환</tspan><tspan x="1092" dy="32">필요한 정보 수집과 첫 영어 발화를 하나의 흐름으로 연결</tspan></text><text x="138" y="834" fill="#111111" font-size="22" font-weight="700"><tspan x="138" dy="0">근거 1. 온라인 학습에서도 나타나는 말하기 불안</tspan></text><text x="138" y="871" fill="#111111" font-size="20" font-weight="400"><tspan x="138" dy="0">온라인 언어 학습자 조사에서 녹음·평가 관련 불안이 보고됨 / 출처: Bárkányi &amp; Brash (2025), ReCALL · 상세 출처와 적용 한계는 7장</tspan></text><text x="138" y="907" fill="#111111" font-size="22" font-weight="700"><tspan x="138" dy="0">근거 2. AI 대화와 말하기 경험의 관계</tspan></text><text x="138" y="943" fill="#111111" font-size="20" font-weight="400"><tspan x="138" dy="0">AI 대화에서 참여 의지와 불안의 개선이 보고됨 / Kim &amp; Su (2024), System / 캐릭터와 온보딩 효과는 별도 검증</tspan></text><text x="138" y="980" fill="#111111" font-size="22" font-weight="700"><tspan x="138" dy="0">근거 3 / 필요한 순간에 제공하는 행동 안내</tspan></text><text x="138" y="1016" fill="#111111" font-size="20" font-weight="400"><tspan x="138" dy="0">사용 맥락에서 바로 적용할 수 있는 도움말을 제안 / Nielsen Norman Group, Onboarding Tutorials vs. Contextual Help / 상세는 7장</tspan></text><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><text x="1928" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="1928" dy="0">2</tspan></text></svg>