<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="6장  돌아보기" style="font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><rect x="0" y="0" width="2048" height="1152" fill="#fff"/><image href="../img/naver-logo.png" x="1861" y="58" width="94" height="19" preserveAspectRatio="xMidYMid meet"/><text x="92" y="80" fill="#202b35" font-size="40" font-weight="700"><tspan x="92" dy="0">6장  돌아보기</tspan></text><path d="M89 103 H1958" stroke="#c9d2d9" stroke-width="1.6"/><text x="92" y="147" fill="#63717c" font-size="28" font-weight="400"><tspan x="92" dy="0">네 가지 질문에 한두 문장으로 답해 주세요. 흰 칸의 항목에 맞춰 적으면 됩니다.</tspan></text><rect x="92" y="178" width="909" height="420" fill="#f5f5f7"/><text x="138" y="244" fill="#202b35" font-size="26" font-weight="700"><tspan x="138" dy="0">1. 선택하지 않은 방법은 무엇인가요?</tspan></text><text x="138" y="278" fill="#63717c" font-size="22" font-weight="400"><tspan x="138" dy="0">검토했지만 선택하지 않은 방법 한 가지와 그 이유를 적어 주세요.</tspan></text><rect x="138" y="308" width="816" height="254" fill="#fff" stroke="#c9d2d9" stroke-width="1.6"/><text x="164" y="415" fill="#202b35" font-size="22" font-weight="400"><tspan x="164" dy="0">검토한 방법 :</tspan><tspan x="164" dy="38">선택하지 않은 이유 :</tspan></text><rect x="1046" y="178" width="909" height="420" fill="#f5f5f7"/><text x="1092" y="244" fill="#202b35" font-size="26" font-weight="700"><tspan x="1092" dy="0">2. 가장 확인하고 싶은 것은 무엇인가요?</tspan></text><text x="1092" y="278" fill="#63717c" font-size="22" font-weight="400"><tspan x="1092" dy="0">확인하지 못하고 예상으로 진행한 내용 한 가지를 적어 주세요. 확인하고 싶은 이유도 함</tspan><tspan x="1092" dy="24">께 적어 주세요.</tspan></text><rect x="1092" y="308" width="816" height="254" fill="#fff" stroke="#c9d2d9" stroke-width="1.6"/><text x="1118" y="415" fill="#202b35" font-size="22" font-weight="400"><tspan x="1118" dy="0">예상한 내용 :</tspan><tspan x="1118" dy="38">확인하고 싶은 이유 :</tspan></text><rect x="92" y="636" width="909" height="410" fill="#f5f5f7"/><text x="138" y="702" fill="#202b35" font-size="26" font-weight="700"><tspan x="138" dy="0">3. 가장 아쉬운 부분은 어디인가요?</tspan></text><text x="138" y="736" fill="#63717c" font-size="22" font-weight="400"><tspan x="138" dy="0">가장 아쉬운 부분 한 가지를 적어 주세요. 시간이 더 있다면 어떻게 보완할지도 함께 적어</tspan><tspan x="138" dy="24">주세요.</tspan></text><rect x="138" y="766" width="816" height="240" fill="#fff" stroke="#c9d2d9" stroke-width="1.6"/><text x="164" y="865" fill="#202b35" font-size="22" font-weight="400"><tspan x="164" dy="0">아쉬운 부분 :</tspan><tspan x="164" dy="38">보완할 방법 :</tspan></text><rect x="1046" y="636" width="909" height="410" fill="#f5f5f7"/><text x="1092" y="702" fill="#202b35" font-size="26" font-weight="700"><tspan x="1092" dy="0">4. AI 도구를 어떻게 활용했나요?</tspan></text><text x="1092" y="736" fill="#63717c" font-size="22" font-weight="400"><tspan x="1092" dy="0">AI 도구에 맡긴 작업과 직접 수정한 부분을 적어 주세요. 사용하지 않았다면 &#x27;사용하지 않음&#x27;이라고</tspan><tspan x="1092" dy="24">적어 주세요.</tspan></text><rect x="1092" y="766" width="816" height="240" fill="#fff" stroke="#c9d2d9" stroke-width="1.6"/><text x="1118" y="865" fill="#202b35" font-size="22" font-weight="400"><tspan x="1118" dy="0">AI 도구에 맡긴 작업 :</tspan><tspan x="1118" dy="38">직접 수정한 부분 :</tspan></text><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text></svg>