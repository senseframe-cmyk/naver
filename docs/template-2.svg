<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="2장  사용자와 문제" style="font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><rect x="0" y="0" width="2048" height="1152" fill="#fff"/><image href="../img/naver-logo.png" x="1861" y="58" width="94" height="19" preserveAspectRatio="xMidYMid meet"/><text x="92" y="80" fill="#202b35" font-size="40" font-weight="700"><tspan x="92" dy="0">2장  사용자와 문제</tspan></text><path d="M89 103 H1958" stroke="#c9d2d9" stroke-width="1.6"/><rect x="92" y="150" width="909" height="493" fill="#f5f5f7"/><text x="138" y="220" fill="#202b35" font-size="34" font-weight="700"><tspan x="138" dy="0">사용자 그룹</tspan></text><text x="138" y="269" fill="#63717c" font-size="22" font-weight="400"><tspan x="138" dy="0">누구인지 떠올릴 수 있게 구체적으로 적어 주세요.</tspan><tspan x="138" dy="32">나이대, 상황, 사용 기기처럼 설계에 영향을 주는 특징도 함께 적어 주세요.</tspan></text><rect x="1046" y="150" width="909" height="493" fill="#f5f5f7"/><text x="1092" y="220" fill="#202b35" font-size="34" font-weight="700"><tspan x="1092" dy="0">문제</tspan></text><text x="1092" y="269" fill="#63717c" font-size="22" font-weight="400"><tspan x="1092" dy="0">이 사용자의 어떤 순간이 왜 잘되지 않는지 적어 주세요.</tspan><tspan x="1092" dy="32">고른 주제(온보딩, 루틴과 알림, 예약)와 관련된 문제를 한두 가지로 좁혀 주세요.</tspan></text><rect x="92" y="690" width="1864" height="356" fill="#f5f5f7"/><text x="138" y="772" fill="#202b35" font-size="34" font-weight="700"><tspan x="138" dy="0">그렇게 판단한 근거</tspan></text><text x="138" y="820" fill="#63717c" font-size="22" font-weight="400"><tspan x="138" dy="0">관찰, 자료, 경험 가운데 무엇을 근거로 삼았는지 적어 주세요. 확인하지 못한 내용은 &#x27;예상&#x27;이라고 표시해 주세요.</tspan></text><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text></svg>