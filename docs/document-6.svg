<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="6장  돌아보기" style="font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><rect x="0" y="0" width="2048" height="1152" fill="#fff"/><image href="img/naver-logo.png" x="1861" y="58" width="94" height="19" preserveAspectRatio="xMidYMid meet"/><text x="92" y="80" fill="#202b35" font-size="40" font-weight="700"><tspan x="92" dy="0">6장  돌아보기</tspan></text><path d="M89 103 H1958" stroke="#c9d2d9" stroke-width="1.6"/><text x="92" y="147" fill="#63717c" font-size="28" font-weight="400"><tspan x="92" dy="0">첫 만남부터 첫 영어 발화까지 / 설계 판단과 아직 확인하지 못한 점을 돌아봅니다</tspan></text><rect x="92" y="178" width="909" height="420" fill="#f5f5f7"/><text x="138" y="244" fill="#202b35" font-size="26" font-weight="700"><tspan x="138" dy="0">1. 선택하지 않은 방법은 무엇인가요?</tspan></text><text x="138" y="278" fill="#63717c" font-size="22" font-weight="400"><tspan x="138" dy="0">설정을 먼저 끝내는 방식 대신 대화 안에서 필요한 정보를 수집했습니다</tspan></text><rect x="138" y="308" width="816" height="254" fill="#fff" stroke="#c9d2d9" stroke-width="1.6"/><rect x="1046" y="178" width="909" height="420" fill="#f5f5f7"/><text x="1092" y="244" fill="#202b35" font-size="26" font-weight="700"><tspan x="1092" dy="0">2. 가장 확인하고 싶은 것은 무엇인가요?</tspan></text><text x="1092" y="278" fill="#63717c" font-size="22" font-weight="400"><tspan x="1092" dy="0">캐릭터에 대한 흥미가 정보 입력과 첫 영어 발화로 이어지는지</tspan><tspan x="1092" dy="24">실제 사용자의 행동으로 확인할 필요가 있습니다</tspan></text><rect x="1092" y="308" width="816" height="254" fill="#fff" stroke="#c9d2d9" stroke-width="1.6"/><rect x="92" y="636" width="909" height="410" fill="#f5f5f7"/><text x="138" y="702" fill="#202b35" font-size="26" font-weight="700"><tspan x="138" dy="0">3. 가장 아쉬운 부분은 어디인가요?</tspan></text><text x="138" y="736" fill="#63717c" font-size="22" font-weight="400"><tspan x="138" dy="0">음성 인식 오류 대응과 입력 대안이 실제 기기에서도</tspan><tspan x="138" dy="24">부담 없이 이어지는지 검증이 필요합니다</tspan></text><rect x="138" y="766" width="816" height="240" fill="#fff" stroke="#c9d2d9" stroke-width="1.6"/><rect x="1046" y="636" width="909" height="410" fill="#f5f5f7"/><text x="1092" y="702" fill="#202b35" font-size="26" font-weight="700"><tspan x="1092" dy="0">4. AI 도구를 어떻게 활용했나요?</tspan></text><text x="1092" y="736" fill="#63717c" font-size="22" font-weight="400"><tspan x="1092" dy="0">AI로 구현과 시각화 초안을 만들고 흐름과 표현은</tspan><tspan x="1092" dy="24">설계 의도에 맞춰 직접 검토하고 수정했습니다</tspan></text><rect x="1092" y="766" width="816" height="240" fill="#fff" stroke="#c9d2d9" stroke-width="1.6"/><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><text x="1928" y="1104" fill="#63717c" font-size="22">6</text><foreignObject x="164" y="344" width="764" height="194"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Pretendard,Apple SD Gothic Neo,sans-serif;font-size:20px;line-height:1.55;color:#202b35;display:flex;flex-direction:column;gap:12px;word-break:keep-all;overflow-wrap:break-word;"><p style="margin:0"><strong style="font-weight:700">검토한 방법 : </strong>온보딩 초기에 별도의 설문과 레벨 테스트를 제공하는 방식</p><p style="margin:0"><strong style="font-weight:700">선택하지 않은 이유 : </strong>첫 이용 전에 설정이 길어지면 실제 대화의 가치를 경험하기 어려울 수 있다고 판단</p><p style="margin:0"><strong style="font-weight:700">대안 : </strong>시작 / 선택 / 이전 조작은 유지하고, 이름 응답부터 쉬운 영어 인사까지 대화로 연결</p></div></foreignObject><foreignObject x="1118" y="344" width="764" height="194"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Pretendard,Apple SD Gothic Neo,sans-serif;font-size:20px;line-height:1.55;color:#202b35;display:flex;flex-direction:column;gap:12px;word-break:keep-all;overflow-wrap:break-word;"><p style="margin:0"><strong style="font-weight:700">검증할 가설 : </strong>캐릭터와의 상호작용이 첫 영어 발화에 대한 심리적 부담을 낮출 것이라는 가설</p><p style="margin:0"><strong style="font-weight:700">확인할 이유 : </strong>캐릭터에 대한 흥미가 실제 영어 발화 행동으로 이어지는지 검증 필요</p><p style="margin:0"><strong style="font-weight:700">검증 방법 : </strong>동일한 질문 / 조작 조건에서 캐릭터 유무에 따른 완료율과 부담감 비교</p></div></foreignObject><foreignObject x="164" y="802" width="764" height="180"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Pretendard,Apple SD Gothic Neo,sans-serif;font-size:20px;line-height:1.55;color:#202b35;display:flex;flex-direction:column;gap:12px;word-break:keep-all;overflow-wrap:break-word;"><p style="margin:0"><strong style="font-weight:700">아쉬운 부분 : </strong>음성 인식 실패 상황에 대한 대응과 접근성 검증이 충분하지 않은 점</p><p style="margin:0"><strong style="font-weight:700">보완할 방법 : </strong>오류별 안내 / 이름 수정 / 텍스트 입력 대안의 사용성 보완</p><p style="margin:0"><strong style="font-weight:700">추가 검증 : </strong>실제 기기에서 음성 인식 정확도와 발화 실패 시 사용자 반응 확인</p></div></foreignObject><foreignObject x="1118" y="802" width="764" height="180"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Pretendard,Apple SD Gothic Neo,sans-serif;font-size:20px;line-height:1.55;color:#202b35;display:flex;flex-direction:column;gap:12px;word-break:keep-all;overflow-wrap:break-word;"><p style="margin:0"><strong style="font-weight:700">AI 활용 : </strong>화면 프로토타입 구현, 캐릭터 이미지 및 모션 초안 제작, 자료 탐색 및 시각화 초안 생성</p><p style="margin:0"><strong style="font-weight:700">직접 수행 : </strong>UX 흐름 설계, 화면별 문구 수정, 인터랙션 및 보상 정책 결정</p><p style="margin:0"><strong style="font-weight:700">추가 검증 : </strong>생성된 결과물을 직접 검토하고, 프로토타입을 반복 수정하여 완성도 개선</p></div></foreignObject></svg>