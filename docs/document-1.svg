<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="헬스케어 프로덕트 UX 디자인 사전 과제" style="font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><rect x="0" y="0" width="2048" height="1152" fill="#fff"/><image href="img/naver-logo.png" x="1861" y="58" width="94" height="19" preserveAspectRatio="xMidYMid meet"/><text x="92" y="185" fill="#202b35" font-size="72" font-weight="700"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제</tspan></text><text x="92" y="253" fill="#202b35" font-size="30" font-weight="400"><tspan x="92" dy="0">[NAVER] 헬스케어 UX 디자인 (경력)  ·  1장 표지</tspan></text><rect x="92" y="414" width="1106" height="610" fill="#fff"/><rect x="92" y="414" width="307" height="610" fill="#f5f5f7"/><path d="M92 414.0 H1198" stroke="#c9d2d9" stroke-width="1.6"/><path d="M92 515.6666666666666 H1198" stroke="#c9d2d9" stroke-width="1.6"/><path d="M92 617.3333333333334 H1198" stroke="#c9d2d9" stroke-width="1.6"/><path d="M92 719.0 H1198" stroke="#c9d2d9" stroke-width="1.6"/><path d="M92 820.6666666666667 H1198" stroke="#c9d2d9" stroke-width="1.6"/><path d="M92 922.3333333333334 H1198" stroke="#c9d2d9" stroke-width="1.6"/><path d="M92 1024.0 H1198" stroke="#c9d2d9" stroke-width="1.6"/><path d="M92 414 V1024" stroke="#c9d2d9" stroke-width="1.6"/><path d="M399 414 V1024" stroke="#c9d2d9" stroke-width="1.6"/><path d="M1198 414 V1024" stroke="#c9d2d9" stroke-width="1.6"/><text x="114" y="477.0" fill="#202b35" font-size="30" font-weight="700"><tspan x="114" dy="0">성명</tspan></text><text x="420" y="477.0" fill="#63717c" font-size="30" font-weight="400"><tspan x="420" dy="0"></tspan></text><text x="114" y="578.6666666666666" fill="#202b35" font-size="30" font-weight="700"><tspan x="114" dy="0">고른 주제</tspan></text><text x="420" y="578.6666666666666" fill="#63717c" font-size="30" font-weight="400"><tspan x="420" dy="0">▫ 1. 온보딩     ▫ 2. 루틴과 알림     ▫ 3. 예약</tspan></text><text x="114" y="680.3333333333334" fill="#202b35" font-size="30" font-weight="700"><tspan x="114" dy="0">고른 생활 분야</tspan></text><text x="420" y="680.3333333333334" fill="#63717c" font-size="30" font-weight="400"><tspan x="420" dy="0"></tspan></text><text x="114" y="782.0" fill="#202b35" font-size="30" font-weight="700"><tspan x="114" dy="0">사용자 그룹</tspan></text><text x="420" y="782.0" fill="#63717c" font-size="30" font-weight="400"><tspan x="420" dy="0">한 줄로 적어 주세요</tspan></text><text x="114" y="883.6666666666667" fill="#202b35" font-size="30" font-weight="700"><tspan x="114" dy="0">지원 직무</tspan></text><text x="420" y="883.6666666666667" fill="#63717c" font-size="30" font-weight="400"><tspan x="420" dy="0">▫ UX 화면설계     ▫ UI 디자인</tspan></text><text x="114" y="985.3333333333334" fill="#202b35" font-size="30" font-weight="700"><tspan x="114" dy="0">인터랙션 링크</tspan></text><text x="420" y="985.3333333333334" fill="#63717c" font-size="30" font-weight="400"><tspan x="420" dy="0">(선택) Interaction Design Link 주소를 적어 주세요</tspan></text><rect x="1266" y="414" width="690" height="610" fill="#f5f5f7"/><text x="1312" y="484" fill="#202b35" font-size="34" font-weight="700"><tspan x="1312" dy="0">제출 전 확인</tspan></text><text x="1312" y="539" fill="#202b35" font-size="28" font-weight="400"><tspan x="1312" dy="0">•</tspan></text><text x="1370" y="539" fill="#202b35" font-size="28" font-weight="400"><tspan x="1370" dy="0">PDF 파일 1개로 제출합니다.</tspan></text><text x="1312" y="583" fill="#202b35" font-size="28" font-weight="400"><tspan x="1312" dy="0">•</tspan></text><text x="1370" y="583" fill="#202b35" font-size="28" font-weight="400"><tspan x="1370" dy="0">표지 포함 기본 6장 이내입니다. 화면 설명이</tspan><tspan x="1370" dy="30">더 필요하면 맨 뒤에 2장까지 더 붙일 수 있습</tspan><tspan x="1370" dy="30">니다.</tspan></text><text x="1312" y="688" fill="#202b35" font-size="28" font-weight="400"><tspan x="1312" dy="0">•</tspan></text><text x="1370" y="688" fill="#202b35" font-size="28" font-weight="400"><tspan x="1370" dy="0">인터랙션 디자인 링크도 함께 낼 수 있습니다.</tspan><tspan x="1370" dy="30">주소는 왼쪽 표에 적습니다.</tspan></text><text x="1312" y="763" fill="#202b35" font-size="28" font-weight="400"><tspan x="1312" dy="0">•</tspan></text><text x="1370" y="763" fill="#202b35" font-size="28" font-weight="400"><tspan x="1370" dy="0">장의 순서와 제목을 이 양식과 같게 유지합니</tspan><tspan x="1370" dy="30">다. Figma 등 다른 도구로 작성해도 됩니다.</tspan></text><text x="1312" y="838" fill="#202b35" font-size="28" font-weight="400"><tspan x="1312" dy="0">•</tspan></text><text x="1370" y="838" fill="#202b35" font-size="28" font-weight="400"><tspan x="1370" dy="0">회색 안내 문구와 점선 상자는 지우고 작성합</tspan><tspan x="1370" dy="30">니다.</tspan></text><text x="1312" y="913" fill="#202b35" font-size="28" font-weight="400"><tspan x="1312" dy="0">•</tspan></text><text x="1370" y="913" fill="#202b35" font-size="28" font-weight="400"><tspan x="1370" dy="0">건강 관리(운동, 식단 포함), 의료, 병원 분야는</tspan><tspan x="1370" dy="30">고르지 않습니다.</tspan></text><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><text x="92" y="334" fill="#215e50" font-size="31" font-weight="600"><tspan x="92" dy="0">Montalk — 말하기가 망설여지는 순간, 작은 친구와 시작하는 영어 대화</tspan></text><text x="420" y="477" fill="#215e50" font-size="30" font-weight="600"><tspan x="420" dy="0">허대성</tspan></text><text x="420" y="605" fill="#215e50" font-size="23" font-weight="600"><tspan x="420" dy="0">선택: 1. 온보딩</tspan></text><text x="420" y="680" fill="#215e50" font-size="29" font-weight="600"><tspan x="420" dy="0">교육 · 일상 영어회화</tspan></text><text x="420" y="810" fill="#215e50" font-size="23" font-weight="600"><tspan x="420" dy="0">영어로 첫마디를 꺼내기 망설이는 성인 초급 학습자</tspan></text><text x="420" y="910" fill="#215e50" font-size="23" font-weight="600"><tspan x="420" dy="0">UX 화면설계 · UI 디자인</tspan></text><a href="#prototype" target="_blank" rel="noopener noreferrer"><text x="420" y="1013" fill="#215e50" font-size="22" font-weight="400"><tspan x="420" dy="0">동일 사이트의 Prototype 탭에서 체험</tspan></text><path d="M420 1018h290.40000000000003" stroke="#215e50"/></a></svg>