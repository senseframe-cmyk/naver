function hatchColorBurst(x,y){
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const burst=document.createElement('div');burst.className='hatch-color-burst';burst.setAttribute('aria-hidden','true');
 const colors=['#78e4b5','#6ddfc9','#62d2e7','#59bdef','#9ae7c0'];
 const width=screen.clientWidth,height=screen.clientHeight;
 for(let i=0;i<16;i++){
  const dot=document.createElement('i'),angle=(i/16)*Math.PI*2+(Math.random()-.5)*.55;
  const size=(52+Math.random()*24)*.5,dx=Math.cos(angle),dy=Math.sin(angle);
  const travelX=dx>0?(width-x+size)/dx:dx<0?(-x-size)/dx:Infinity;
  const travelY=dy>0?(height-y+size)/dy:dy<0?(-y-size)/dy:Infinity;
  const distance=Math.min(travelX,travelY)+100;
  const rx=(Math.random()-.5)*105,ry=(Math.random()-.5)*115,depth=(Math.random()-.5)*240;
  Object.assign(dot.style,{left:x+'px',top:y+'px',width:size+'px',height:size+'px',background:colors[i%colors.length]});burst.appendChild(dot);
  const tx=dx*distance,ty=dy*distance;
  const pose=(px,py,z,s,r)=>'translate3d(calc(-50% + '+px+'px),calc(-50% + '+py+'px),'+z+'px) rotateX('+rx*r+'deg) rotateY('+ry*r+'deg) scale('+s+')';
  dot.animate([
   {transform:pose(0,0,0,.3,0),opacity:.95},
   {transform:pose(tx*.3,ty*.3-20,depth*.5,1,.5),opacity:.95,offset:.22},
   {transform:pose(tx,ty,depth,depth>0?1.1:.65,1),opacity:.4}
  ],{duration:950+Math.random()*350,easing:'cubic-bezier(.12,.55,.3,1)',fill:'both'});
 }

}

ic Neo,Noto Sans CJK KR,sans-serif\"><rect x=\"0\" y=\"0\" width=\"2048\" height=\"1152\" fill=\"#fff\"/><image href=\"img/naver-logo.png\" x=\"1861\" y=\"58\" width=\"94\" height=\"19\" preserveAspectRatio=\"xMidYMid meet\"/><path d=\"M89 103 H1958\" stroke=\"#c9d2d9\" stroke-width=\"1.6\"/><rect x=\"92\" y=\"150\" width=\"909\" height=\"493\" fill=\"#f5f5f7\"/><rect x=\"1046\" y=\"150\" width=\"909\" height=\"493\" fill=\"#f5f5f7\"/><rect x=\"92\" y=\"690\" width=\"1864\" height=\"356\" fill=\"#f5f5f7\"/><text x=\"92\" y=\"80\" fill=\"#202b35\" font-size=\"40\" font-weight=\"700\"><tspan x=\"92\" dy=\"0\">2장  사용자와 문제</tspan></text><text x=\"138\" y=\"220\" fill=\"#202b35\" font-size=\"34\" font-weight=\"700\"><tspan x=\"138\" dy=\"0\">사용자 그룹</tspan></text><text x=\"1092\" y=\"220\" fill=\"#202b35\" font-size=\"34\" font-weight=\"700\"><tspan x=\"1092\" dy=\"0\">문제</tspan></text><text x=\"138\" y=\"772\" fill=\"#202b35\" font-size=\"34\" font-weight=\"700\"><tspan x=\"138\" dy=\"0\">그렇게 판단한 근거</tspan></text><text x=\"138\" y=\"273\" fill=\"#111111\" font-size=\"22\" font-weight=\"700\"><tspan x=\"138\" dy=\"0\">사용자 특성</tspan></text><text x=\"138\" y=\"305\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"138\" dy=\"0\">기본적인 영어 지식은 있지만, 실제 영어로 말하기에 자신감이 부족한</tspan><tspan x=\"138\" dy=\"32\">20~30대 성인 영어회화 초급 또는 재시작 학습자.</tspan></text><text x=\"138\" y=\"395\" fill=\"#111111\" font-size=\"22\" font-weight=\"700\"><tspan x=\"138\" dy=\"0\">이용 환경</tspan></text><text x=\"138\" y=\"427\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"138\" dy=\"0\">출퇴근 전후나 집에서 짧은 시간 동안 영어회화를 연습하며,</tspan><tspan x=\"138\" dy=\"32\">타인의 시선 없이 혼자 편안하게 말하기를 시작하고 싶은 사용자.</tspan></text><text x=\"138\" y=\"517\" fill=\"#111111\" font-size=\"22\" font-weight=\"700\"><tspan x=\"138\" dy=\"0\">학습 장벽</tspan></text><text x=\"138\" y=\"549\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"138\" dy=\"0\">초기 설정 과정과 수준 평가에 부담을 느끼고, 영어 발화에 대한</tspan><tspan x=\"138\" dy=\"32\">심리적 장벽으로 첫 대화를 망설이는 사용자.</tspan></text><text x=\"1092\" y=\"273\" fill=\"#111111\" font-size=\"22\" font-weight=\"700\"><tspan x=\"1092\" dy=\"0\">문제 1. 첫 대화보다 설정이 앞서는 온보딩</tspan></text><text x=\"1092\" y=\"305\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"1092\" dy=\"0\">학습 목적 선택과 수준 평가 등 사전 설정 과정으로 인해,</tspan><tspan x=\"1092\" dy=\"32\">사용자가 핵심 경험인 영어회화를 시작하기까지 여러 단계를 거쳐야 함.</tspan></text><text x=\"1092\" y=\"395\" fill=\"#111111\" font-size=\"22\" font-weight=\"700\"><tspan x=\"1092\" dy=\"0\">문제 2. 첫 발화를 가로막는 심리적 장벽</tspan></text><text x=\"1092\" y=\"427\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"1092\" dy=\"0\">발음과 실수에 대한 걱정, 평가받는다는 부담으로 인해</tspan><tspan x=\"1092\" dy=\"32\">첫 영어 발화를 망설이거나 회피할 수 있음.</tspan></text><text x=\"1092\" y=\"517\" fill=\"#111111\" font-size=\"22\" font-weight=\"700\"><tspan x=\"1092\" dy=\"0\">목표</tspan></text><text x=\"1092\" y=\"549\" fill=\"#111111\" font-size=\"22\" font-weight=\"700\"><tspan x=\"1092\" dy=\"0\">별도의 정보 입력보다 캐릭터와의 대화를 우선하고,</tspan><tspan x=\"1092\" dy=\"32\">자연스러운 정보 수집과 첫 영어 발화를 하나의 경험으로 연결.</tspan></text><text x=\"138\" y=\"834\" fill=\"#111111\" font-size=\"22\" font-weight=\"700\"><tspan x=\"138\" dy=\"0\">근거 1. 사전 설명보다 실제 사용 경험의 중요성</tspan></text><text x=\"138\" y=\"871\" fill=\"#111111\" font-size=\"20\" font-weight=\"400\"><tspan x=\"138\" dy=\"0\">사전 튜토리얼은 건너뛰기 쉬우며, 사용 맥락에 맞춰 필요한 안내를 제공하는 방식이 효과적일 수 있음 / 출처 : Nielsen Norman Group, Onboarding Tutorials vs. Contextual Help</tspan></text><text x=\"138\" y=\"907\" fill=\"#111111\" font-size=\"22\" font-weight=\"700\"><tspan x=\"138\" dy=\"0\">근거 2. 영어 말하기를 가로막는 심리적 장벽</tspan></text><text x=\"138\" y=\"943\" fill=\"#111111\" font-size=\"20\" font-weight=\"400\"><tspan x=\"138\" dy=\"0\">외국어 학습에서 의사소통 불안과 부정적 평가에 대한 두려움은 실제 언어 사용을 어렵게 만드는 요인으로 작용 / 출처 : Horwitz et al. (1986), Foreign Language Classroom Anxiety</tspan></text><text x=\"138\" y=\"980\" fill=\"#111111\" font-size=\"22\" font-weight=\"700\"><tspan x=\"138\" dy=\"0\">근거 3. AI 대화를 통한 말하기 부담 완화 가능성</tspan></text><text x=\"138\" y=\"1016\" fill=\"#111111\" font-size=\"20\" font-weight=\"400\"><tspan x=\"138\" dy=\"0\">AI 챗봇 기반 영어 학습 연구에서 말하기 불안 완화와 자신감 향상 등 긍정적 가능성이 보고됨 / 출처 : Du &amp; Daniel (2024), AI 챗봇 기반 영어 말하기 학습 연구</tspan></text><text x=\"92\" y=\"1104\" fill=\"#63717c\" font-size=\"22\" font-weight=\"400\"><tspan x=\"92\" dy=\"0\">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><text x=\"1928\" y=\"1104\" fill=\"#63717c\" font-size=\"22\" font-weight=\"400\"><tspan x=\"1928\" dy=\"0\">2</tspan></text></svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 2048 1152\" role=\"img\" aria-label=\"3장 핵심 흐름\" style=\"font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif\"><rect width=\"2048\" height=\"1152\" fill=\"#fff\"/><image href=\"img/naver-logo.png\" x=\"1861\" y=\"58\" width=\"94\" height=\"19\"/><path d=\"M89 103H1958\" stroke=\"#c9d2d9\" stroke-width=\"1.6\"/><text x=\"92\" y=\"80\" fill=\"#202b35\" font-size=\"40\" font-weight=\"700\"><tspan x=\"92\" dy=\"0\">3장  핵심 흐름</tspan></text><text x=\"89\" y=\"161\" fill=\"#111111\" font-size=\"24\" font-weight=\"700\"><tspan x=\"89\" dy=\"0\">설정으로 시작하는 온보딩에서 캐릭터와의 첫 대화로 시작하는 온보딩으로 전환</tspan></text><rect x=\"89.0\" y=\"223\" width=\"341\" height=\"250\" rx=\"32\" fill=\"#f5f5f7\"/><text x=\"121.0\" y=\"283\" fill=\"#111111\" font-size=\"23\" font-weight=\"700\"><tspan x=\"121.0\" dy=\"0\">1. 첫 만남</tspan></text><text x=\"121.0\" y=\"389\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"121.0\" dy=\"0\">알을 터치해 캐릭터를</tspan><tspan x=\"121.0\" dy=\"32\">깨우고 첫 상호작용 시작</tspan></text><path d=\"M430.0 348H456.0\" stroke=\"#202b35\" stroke-width=\"1.6\"/><path d=\"M455.0 343L464.0 348L455.0 353Z\" fill=\"#202b35\"/><rect x=\"471.25\" y=\"223\" width=\"341\" height=\"250\" rx=\"32\" fill=\"#f5f5f7\"/><text x=\"503.25\" y=\"283\" fill=\"#111111\" font-size=\"23\" font-weight=\"700\"><tspan x=\"503.25\" dy=\"0\">2. 대화 시작</tspan></text><text x=\"503.25\" y=\"389\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"503.25\" dy=\"0\">캐릭터가 먼저 말을 걸고</tspan><tspan x=\"503.25\" dy=\"32\">사용자의 자연스러운 응답 유도</tspan></text><path d=\"M812.25 348H838.25\" stroke=\"#202b35\" stroke-width=\"1.6\"/><path d=\"M837.25 343L846.25 348L837.25 353Z\" fill=\"#202b35\"/><rect x=\"853.5\" y=\"223\" width=\"341\" height=\"250\" rx=\"32\" fill=\"#f5f5f7\"/><text x=\"885.5\" y=\"283\" fill=\"#111111\" font-size=\"23\" font-weight=\"700\"><tspan x=\"885.5\" dy=\"0\">3. 정보 수집</tspan></text><text x=\"885.5\" y=\"389\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"885.5\" dy=\"0\">대화 과정에서 이름과</tspan><tspan x=\"885.5\" dy=\"32\">학습 목적 등 필수 정보 수집</tspan></text><path d=\"M1194.5 348H1220.5\" stroke=\"#202b35\" stroke-width=\"1.6\"/><path d=\"M1219.5 343L1228.5 348L1219.5 353Z\" fill=\"#202b35\"/><rect x=\"1235.75\" y=\"223\" width=\"341\" height=\"250\" rx=\"32\" fill=\"#f5f5f7\"/><text x=\"1267.75\" y=\"283\" fill=\"#111111\" font-size=\"23\" font-weight=\"700\"><tspan x=\"1267.75\" dy=\"0\">4. 첫 영어 발화</tspan></text><text x=\"1267.75\" y=\"389\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"1267.75\" dy=\"0\">부담 없는 영어 질문과 긍정적인</tspan><tspan x=\"1267.75\" dy=\"32\">반응으로 첫 말하기 경험 제공</tspan></text><path d=\"M1576.75 348H1602.75\" stroke=\"#202b35\" stroke-width=\"1.6\"/><path d=\"M1601.75 343L1610.75 348L1601.75 353Z\" fill=\"#202b35\"/><rect x=\"1618.0\" y=\"223\" width=\"341\" height=\"250\" rx=\"32\" fill=\"#f5f5f7\"/><text x=\"1650.0\" y=\"283\" fill=\"#111111\" font-size=\"23\" font-weight=\"700\"><tspan x=\"1650.0\" dy=\"0\">5. 홈 진입</tspan></text><text x=\"1650.0\" y=\"389\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"1650.0\" dy=\"0\">첫 대화 후 캐릭터와 함께</tspan><tspan x=\"1650.0\" dy=\"32\">지속적인 영어회화 경험 연결</tspan></text><text x=\"89\" y=\"584\" fill=\"#111111\" font-size=\"24\" font-weight=\"700\"><tspan x=\"89\" dy=\"0\">기존 방식과 차별점</tspan></text><rect x=\"89\" y=\"639\" width=\"906\" height=\"360\" rx=\"32\" fill=\"#f5f5f7\"/><rect x=\"1052\" y=\"639\" width=\"906\" height=\"360\" rx=\"32\" fill=\"#f5f5f7\"/><text x=\"121\" y=\"699\" fill=\"#111111\" font-size=\"23\" font-weight=\"700\"><tspan x=\"121\" dy=\"0\">기존 온보딩</tspan></text><text x=\"121\" y=\"786\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"121\" dy=\"0\">•   학습 목적과 수준을 선택</tspan><tspan x=\"121\" dy=\"47\">•   설정 완료 후 학습 시작</tspan><tspan x=\"121\" dy=\"47\">•   정해진 질문과 선택지 중심</tspan><tspan x=\"121\" dy=\"47\">•   온보딩 완료가 목표</tspan></text><text x=\"1084\" y=\"699\" fill=\"#111111\" font-size=\"23\" font-weight=\"700\"><tspan x=\"1084\" dy=\"0\">Montalk</tspan></text><text x=\"1084\" y=\"786\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"1084\" dy=\"0\">•   캐릭터와 대화하며 자연스럽게 파악</tspan><tspan x=\"1084\" dy=\"47\">•   온보딩 과정에서 첫 영어회화 경험</tspan><tspan x=\"1084\" dy=\"47\">•   사용자 응답에 따라 이어지는 대화</tspan><tspan x=\"1084\" dy=\"47\">•   첫 영어 발화 경험이 목표</tspan></text><path d=\"M1460 836H1528\" stroke=\"#202b35\" stroke-width=\"1.6\"/><path d=\"M1527 831L1536 836L1527 841Z\" fill=\"#202b35\"/><text x=\"1564\" y=\"829\" fill=\"#111111\" font-size=\"24\" font-weight=\"700\"><tspan x=\"1564\" dy=\"0\">사용자가 온보딩을 완료하는 순간,</tspan><tspan x=\"1564\" dy=\"37\">이미 첫 영어회화 경험</tspan></text><text x=\"92\" y=\"1104\" fill=\"#63717c\" font-size=\"22\" font-weight=\"400\"><tspan x=\"92\" dy=\"0\">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><text x=\"1928\" y=\"1104\" fill=\"#63717c\" font-size=\"22\" font-weight=\"400\"><tspan x=\"1928\" dy=\"0\">3</tspan></text></svg>", "<svg xml:space=\"preserve\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 2048 1152\" role=\"img\" aria-label=\"4장  화면 디자인 (1/2)\" style=\"font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif\"><rect x=\"0\" y=\"0\" width=\"2048\" height=\"1152\" fill=\"#fff\"/><image href=\"img/naver-logo.png\" x=\"1861\" y=\"58\" width=\"94\" height=\"19\" preserveAspectRatio=\"xMidYMid meet\"/><text x=\"92\" y=\"80\" fill=\"#202b35\" font-size=\"40\" font-weight=\"700\"><tspan x=\"92\" dy=\"0\">4장  화면 디자인 (1/2)</tspan></text><path d=\"M89 103 H1958\" stroke=\"#c9d2d9\" stroke-width=\"1.6\"/><text x=\"89\" y=\"161\" fill=\"#111111\" font-size=\"24\"><tspan font-weight=\"700\">관계 형성과 대화 시작 / </tspan><tspan>별도 입력 폼 대신 캐릭터와의 상호작용으로 첫 만남부터 학습 정보 수집까지 연결</tspan></text><text x=\"1928\" y=\"1104\" fill=\"#63717c\" font-size=\"22\">4</text></svg>", "<svg xml:space=\"preserve\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 2048 1152\" role=\"img\" aria-label=\"5장  화면 디자인 (2/2)\" style=\"font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif\"><rect x=\"0\" y=\"0\" width=\"2048\" height=\"1152\" fill=\"#fff\"/><image href=\"img/naver-logo.png\" x=\"1861\" y=\"58\" width=\"94\" height=\"19\" preserveAspectRatio=\"xMidYMid meet\"/><text x=\"92\" y=\"80\" fill=\"#202b35\" font-size=\"40\" font-weight=\"700\"><tspan x=\"92\" dy=\"0\">5장  화면 디자인 (2/2)</tspan></text><path d=\"M89 103 H1958\" stroke=\"#c9d2d9\" stroke-width=\"1.6\"/><text x=\"89\" y=\"161\" fill=\"#111111\" font-size=\"24\"><tspan font-weight=\"700\">첫 영어 발화와 작은 성취 / </tspan><tspan>부담 없는 첫 발화부터 인식 상태 안내, 재시도, 긍정적 피드백까지 하나의 대화로 연결</tspan></text><text x=\"1928\" y=\"1104\" fill=\"#63717c\" font-size=\"22\">5</text></svg>", "<svg xml:space=\"preserve\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 2048 1152\" role=\"img\" aria-label=\"6장  돌아보기\" style=\"font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif\"><rect x=\"0\" y=\"0\" width=\"2048\" height=\"1152\" fill=\"#fff\"/><image href=\"img/naver-logo.png\" x=\"1861\" y=\"58\" width=\"94\" height=\"19\" preserveAspectRatio=\"xMidYMid meet\"/><text x=\"92\" y=\"80\" fill=\"#202b35\" font-size=\"40\" font-weight=\"700\"><tspan x=\"92\" dy=\"0\">6장  돌아보기</tspan></text><path d=\"M89 103 H1958\" stroke=\"#c9d2d9\" stroke-width=\"1.6\"/><text x=\"92\" y=\"147\" fill=\"#63717c\" font-size=\"28\" font-weight=\"400\"><tspan x=\"92\" dy=\"0\">네 가지 질문에 한두 문장으로 답해 주세요. 흰 칸의 항목에 맞춰 적으면 됩니다.</tspan></text><rect x=\"92\" y=\"178\" width=\"909\" height=\"420\" fill=\"#f5f5f7\"/><text x=\"138\" y=\"244\" fill=\"#202b35\" font-size=\"26\" font-weight=\"700\"><tspan x=\"138\" dy=\"0\">1. 선택하지 않은 방법은 무엇인가요?</tspan></text><text x=\"138\" y=\"278\" fill=\"#63717c\" font-size=\"22\" font-weight=\"400\"><tspan x=\"138\" dy=\"0\">검토했지만 선택하지 않은 방법 한 가지와 그 이유를 적어 주세요.</tspan></text><rect x=\"138\" y=\"308\" width=\"816\" height=\"254\" fill=\"#fff\" stroke=\"#c9d2d9\" stroke-width=\"1.6\"/><rect x=\"1046\" y=\"178\" width=\"909\" height=\"420\" fill=\"#f5f5f7\"/><text x=\"1092\" y=\"244\" fill=\"#202b35\" font-size=\"26\" font-weight=\"700\"><tspan x=\"1092\" dy=\"0\">2. 가장 확인하고 싶은 것은 무엇인가요?</tspan></text><text x=\"1092\" y=\"278\" fill=\"#63717c\" font-size=\"22\" font-weight=\"400\"><tspan x=\"1092\" dy=\"0\">확인하지 못하고 예상으로 진행한 내용 한 가지를 적어 주세요. 확인하고 싶은 이유도 함</tspan><tspan x=\"1092\" dy=\"24\">께 적어 주세요.</tspan></text><rect x=\"1092\" y=\"308\" width=\"816\" height=\"254\" fill=\"#fff\" stroke=\"#c9d2d9\" stroke-width=\"1.6\"/><rect x=\"92\" y=\"636\" width=\"909\" height=\"410\" fill=\"#f5f5f7\"/><text x=\"138\" y=\"702\" fill=\"#202b35\" font-size=\"26\" font-weight=\"700\"><tspan x=\"138\" dy=\"0\">3. 가장 아쉬운 부분은 어디인가요?</tspan></text><text x=\"138\" y=\"736\" fill=\"#63717c\" font-size=\"22\" font-weight=\"400\"><tspan x=\"138\" dy=\"0\">가장 아쉬운 부분 한 가지를 적어 주세요. 시간이 더 있다면 어떻게 보완할지도 함께 적어</tspan><tspan x=\"138\" dy=\"24\">주세요.</tspan></text><rect x=\"138\" y=\"766\" width=\"816\" height=\"240\" fill=\"#fff\" stroke=\"#c9d2d9\" stroke-width=\"1.6\"/><rect x=\"1046\" y=\"636\" width=\"909\" height=\"410\" fill=\"#f5f5f7\"/><text x=\"1092\" y=\"702\" fill=\"#202b35\" font-size=\"26\" font-weight=\"700\"><tspan x=\"1092\" dy=\"0\">4. AI 도구를 어떻게 활용했나요?</tspan></text><text x=\"1092\" y=\"736\" fill=\"#63717c\" font-size=\"22\" font-weight=\"400\"><tspan x=\"1092\" dy=\"0\">AI 도구에 맡긴 작업과 직접 수정한 부분을 적어 주세요. 사용하지 않았다면 &#x27;사용하지 않음&#x27;이라고</tspan><tspan x=\"1092\" dy=\"24\">적어 주세요.</tspan></text><rect x=\"1092\" y=\"766\" width=\"816\" height=\"240\" fill=\"#fff\" stroke=\"#c9d2d9\" stroke-width=\"1.6\"/><text x=\"92\" y=\"1104\" fill=\"#63717c\" font-size=\"22\" font-weight=\"400\"><tspan x=\"92\" dy=\"0\">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><text x=\"1928\" y=\"1104\" fill=\"#63717c\" font-size=\"22\">6</text><foreignObject x=\"164\" y=\"344\" width=\"764\" height=\"194\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"font-family:Pretendard,Apple SD Gothic Neo,sans-serif;font-size:20px;line-height:1.55;color:#202b35;display:flex;flex-direction:column;gap:12px;word-break:keep-all;overflow-wrap:break-word;\"><p style=\"margin:0\"><strong style=\"font-weight:700\">검토한 방법 : </strong>온보딩 초기에 별도의 설문과 레벨 테스트를 제공하는 방식</p><p style=\"margin:0\"><strong style=\"font-weight:700\">선택하지 않은 이유 : </strong>첫 영어 발화 전에 정보 입력과 수준 평가가 선행되면 사용자의 심리적 부담이 커질 수 있다고 판단</p><p style=\"margin:0\"><strong style=\"font-weight:700\">대안 : </strong>캐릭터와의 대화 속에서 필요한 정보를 수집하고, 쉬운 영어 인사로 자연스럽게 연결</p></div></foreignObject><foreignObject x=\"1118\" y=\"344\" width=\"764\" height=\"194\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"font-family:Pretendard,Apple SD Gothic Neo,sans-serif;font-size:20px;line-height:1.55;color:#202b35;display:flex;flex-direction:column;gap:12px;word-break:keep-all;overflow-wrap:break-word;\"><p style=\"margin:0\"><strong style=\"font-weight:700\">검증할 가설 : </strong>캐릭터와의 상호작용이 첫 영어 발화에 대한 심리적 부담을 낮출 것이라는 가설</p><p style=\"margin:0\"><strong style=\"font-weight:700\">확인할 이유 : </strong>캐릭터에 대한 흥미가 실제 영어 발화 행동으로 이어지는지 검증 필요</p><p style=\"margin:0\"><strong style=\"font-weight:700\">검증 방법 : </strong>캐릭터 유무에 따른 첫 영어 발화 도달률과 발화 부담감 비교</p></div></foreignObject><foreignObject x=\"164\" y=\"802\" width=\"764\" height=\"180\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"font-family:Pretendard,Apple SD Gothic Neo,sans-serif;font-size:20px;line-height:1.55;color:#202b35;display:flex;flex-direction:column;gap:12px;word-break:keep-all;overflow-wrap:break-word;\"><p style=\"margin:0\"><strong style=\"font-weight:700\">아쉬운 부분 : </strong>음성 인식 실패 상황에 대한 대응과 접근성 검증이 충분하지 않은 점</p><p style=\"margin:0\"><strong style=\"font-weight:700\">보완할 방법 : </strong>음성 인식 오류별 재시도 안내와 텍스트 입력 대안 제공</p><p style=\"margin:0\"><strong style=\"font-weight:700\">추가 검증 : </strong>실제 기기에서 음성 인식 정확도와 발화 실패 시 사용자 반응 확인</p></div></foreignObject><foreignObject x=\"1118\" y=\"802\" width=\"764\" height=\"180\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"font-family:Pretendard,Apple SD Gothic Neo,sans-serif;font-size:20px;line-height:1.55;color:#202b35;display:flex;flex-direction:column;gap:12px;word-break:keep-all;overflow-wrap:break-word;\"><p style=\"margin:0\"><strong style=\"font-weight:700\">AI 활용 : </strong>화면 프로토타입 구현, 캐릭터 모션 제작, 자료 탐색 및 시각화 초안 생성</p><p style=\"margin:0\"><strong style=\"font-weight:700\">직접 수행 : </strong>UX 흐름 설계, 화면별 문구 수정, 인터랙션 및 보상 정책 결정</p><p style=\"margin:0\"><strong style=\"font-weight:700\">추가 검증 : </strong>생성된 결과물을 직접 검토하고, 프로토타입을 반복 수정하여 완성도 개선</p></div></foreignObject></svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 2048 1152\" role=\"img\" aria-label=\"7장  레퍼런스와 설계 근거\" style=\"font-family:Pretendard,Apple SD Gothic Neo,sans-serif\"><rect x=\"0\" y=\"0\" width=\"2048\" height=\"1152\" rx=\"0\" fill=\"#fff\" /><image href=\"img/naver-logo.png\" x=\"1861\" y=\"58\" width=\"94\" height=\"19\" /><text x=\"92\" y=\"80\" fill=\"#202b35\" font-size=\"40\" font-weight=\"700\"><tspan x=\"92\" dy=\"0\">7장  레퍼런스와 설계 근거</tspan></text><path d=\"M89 103 H1958\" stroke=\"#c9d2d9\" stroke-width=\"1.6\" /><text x=\"92\" y=\"147\" fill=\"#63717c\" font-size=\"28\" font-weight=\"400\"><tspan x=\"92\" dy=\"0\">공개 연구를 참고했습니다. 서비스와 사용자에 대한 해석은 별도 가설로 구분했습니다.</tspan></text><text x=\"92\" y=\"1104\" fill=\"#63717c\" font-size=\"22\" font-weight=\"400\"><tspan x=\"92\" dy=\"0\">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><rect x=\"92\" y=\"200\" width=\"1864\" height=\"260\" rx=\"10\" fill=\"#f5f5f7\" /><text x=\"122\" y=\"243\" fill=\"#111111\" font-size=\"24\" font-weight=\"700\"><tspan x=\"122\" dy=\"0\">01  온라인에서도 말하기 불안은 남아 있음</tspan></text><text x=\"122\" y=\"282\" fill=\"#111111\" font-size=\"20\" font-weight=\"400\"><tspan x=\"122\" dy=\"0\">Bárkányi &amp; Brash · ReCALL · 2025</tspan></text><text x=\"122\" y=\"323\" fill=\"#111111\" font-size=\"22\">•</text><text x=\"122\" y=\"357\" fill=\"#111111\" font-size=\"22\">•</text><text x=\"122\" y=\"391\" fill=\"#111111\" font-size=\"22\">•</text><text x=\"122\" y=\"323\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"146\" dy=\"0\">성인 온라인 언어 학습자 307명 설문과 10명 인터뷰. 녹음·평가에 대한 불안도 보고됨.</tspan><tspan x=\"146\" dy=\"34\">적용: 쉬운 첫 문장, 틀려도 괜찮다는 안내, 듣기·실패 상태의 명확한 피드백.</tspan><tspan x=\"146\" dy=\"34\">한계: 영국 원격대학 맥락. 국내 20~30대와 Montalk의 효과로 일반화할 수 없음.</tspan></text><a href=\"https://doi.org/10.1017/S0958344025000060\" target=\"_blank\" rel=\"noopener noreferrer\"><text x=\"122\" y=\"436\" fill=\"#111111\" font-size=\"20\" font-weight=\"400\"><tspan x=\"122\" dy=\"0\">🔗 : <tspan text-decoration=\"underline\">링크</tspan></tspan></text></a><rect x=\"92\" y=\"482\" width=\"1864\" height=\"260\" rx=\"10\" fill=\"#f5f5f7\" /><text x=\"122\" y=\"525\" fill=\"#111111\" font-size=\"24\" font-weight=\"700\"><tspan x=\"122\" dy=\"0\">02  AI 대화의 가능성, 캐릭터 효과는 아직 가설</tspan></text><text x=\"122\" y=\"564\" fill=\"#111111\" font-size=\"20\" font-weight=\"400\"><tspan x=\"122\" dy=\"0\">Kim &amp; Su · System · 2024</tspan></text><text x=\"122\" y=\"605\" fill=\"#111111\" font-size=\"22\">•</text><text x=\"122\" y=\"639\" fill=\"#111111\" font-size=\"22\">•</text><text x=\"122\" y=\"673\" fill=\"#111111\" font-size=\"22\">•</text><text x=\"122\" y=\"605\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"146\" dy=\"0\">한국어 외국어 학습자의 AI 챗봇 사용과 의사소통 의지·불안·자신감을 살핀 연구.</tspan><tspan x=\"146\" dy=\"34\">적용: 사람 앞에서 평가받기 전, 작은 AI 친구에게 안전하게 말해보는 경험을 제안.</tspan><tspan x=\"146\" dy=\"34\">한계: 연구 언어·집단이 다름. 몬스터·보상·온보딩 완료율의 인과 근거는 아님.</tspan></text><a href=\"https://www.sciencedirect.com/science/article/pii/S0346251X24000381\" target=\"_blank\" rel=\"noopener noreferrer\"><text x=\"122\" y=\"718\" fill=\"#111111\" font-size=\"20\" font-weight=\"400\"><tspan x=\"122\" dy=\"0\">🔗 : <tspan text-decoration=\"underline\">링크</tspan></tspan></text></a><rect x=\"92\" y=\"764\" width=\"1864\" height=\"260\" rx=\"10\" fill=\"#f5f5f7\" /><text x=\"122\" y=\"807\" fill=\"#111111\" font-size=\"24\" font-weight=\"700\"><tspan x=\"122\" dy=\"0\">03  수준에 맞는 언어와 검증의 필요성</tspan></text><text x=\"122\" y=\"846\" fill=\"#111111\" font-size=\"20\" font-weight=\"400\"><tspan x=\"122\" dy=\"0\">Rajaratnam, Gan &amp; Sun · EDULEARN26 · 2026</tspan></text><text x=\"122\" y=\"887\" fill=\"#111111\" font-size=\"22\">•</text><text x=\"122\" y=\"921\" fill=\"#111111\" font-size=\"22\">•</text><text x=\"122\" y=\"955\" fill=\"#111111\" font-size=\"22\">•</text><text x=\"122\" y=\"887\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"146\" dy=\"0\">수준에 맞는 대화 생성과 소규모 파일럿을 연구. 말하기 불안 감소는 통계적으로 확인되지 않음.</tspan><tspan x=\"146\" dy=\"34\">적용: 자기보고 수준은 출발점으로만 활용하고 실제 대화에서 난이도를 조정할 계획.</tspan><tspan x=\"146\" dy=\"34\">한계: 소규모 연구. 난이도 조정이 불안을 반드시 낮춘다고 주장하지 않음.</tspan></text><a href=\"https://arxiv.org/abs/2607.21887\" target=\"_blank\" rel=\"noopener noreferrer\"><text x=\"122\" y=\"1000\" fill=\"#111111\" font-size=\"20\" font-weight=\"400\"><tspan x=\"122\" dy=\"0\">🔗 : <tspan text-decoration=\"underline\">링크</tspan></tspan></text></a></svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 2048 1152\" role=\"img\" aria-label=\"8장  검증 계획과 다음 아이디어\" style=\"font-family:Pretendard,Apple SD Gothic Neo,sans-serif\"><rect x=\"0\" y=\"0\" width=\"2048\" height=\"1152\" rx=\"0\" fill=\"#fff\" /><image href=\"img/naver-logo.png\" x=\"1861\" y=\"58\" width=\"94\" height=\"19\" /><text x=\"92\" y=\"80\" fill=\"#202b35\" font-size=\"40\" font-weight=\"700\"><tspan x=\"92\" dy=\"0\">8장  검증 계획과 다음 아이디어</tspan></text><path d=\"M89 103 H1958\" stroke=\"#c9d2d9\" stroke-width=\"1.6\" /><text x=\"92\" y=\"147\" fill=\"#63717c\" font-size=\"28\" font-weight=\"400\"><tspan x=\"92\" dy=\"0\">현재 구현한 것과 앞으로 확인할 것을 나누어 정리했습니다.</tspan></text><text x=\"92\" y=\"1104\" fill=\"#63717c\" font-size=\"22\" font-weight=\"400\"><tspan x=\"92\" dy=\"0\">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><rect x=\"92\" y=\"195\" width=\"1864\" height=\"390\" rx=\"10\" fill=\"#f5f5f7\" /><text x=\"122\" y=\"240\" fill=\"#111111\" font-size=\"24\" font-weight=\"700\"><tspan x=\"122\" dy=\"0\">가설 → 관찰할 행동 → 다음 결정</tspan></text><text x=\"122\" y=\"294\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"122\" dy=\"0\">① 캐릭터가 부담을 낮추는가?  |  성인 초급·재시작 학습자 5~8명 탐색 인터뷰·사용성 테스트.</tspan><tspan x=\"122\" dy=\"40\">    알·캐릭터형과 단순 대화형을 비교해 망설임·도움 요청·부담을 관찰. 인과 효과는 후속 검증.</tspan><tspan x=\"122\" dy=\"40\">② 흐름이 너무 긴가?  |  단계별 진입·완료·건너뛰기·재시도 이벤트와 첫 영어 발화까지 시간 측정.</tspan><tspan x=\"122\" dy=\"40\">    첫 영어 완료율·권한 이탈률·재시도 성공률을 측정. 7단계와 축약 흐름을 비교해 불필요한 단계 축소.</tspan><tspan x=\"122\" dy=\"40\">③ 보상이 말하기를 이어주는가?  |  포인트 노출 유무에 따른 다음 영어 대화 시작·다음 날 복귀 비교.</tspan><tspan x=\"122\" dy=\"40\">    소규모 탐색 결과를 효과 확정으로 해석하지 않고, 충분한 표본의 후속 비교 실험으로 검증.</tspan></text><rect x=\"92\" y=\"625\" width=\"909\" height=\"420\" rx=\"10\" fill=\"#f5f5f7\" /><text x=\"122\" y=\"671\" fill=\"#111111\" font-size=\"24\" font-weight=\"700\"><tspan x=\"122\" dy=\"0\">다음 구현 · 접근성과 신뢰</tspan></text><text x=\"122\" y=\"722\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"122\" dy=\"0\">• 한국어·영어 오인식, 권한 거부, 미지원 환경의 대안 입력.</tspan><tspan x=\"122\" dy=\"42\">• 보상은 실제 영어 대화 완료 이벤트에 연결하고 중복 방지.</tspan><tspan x=\"122\" dy=\"42\">• 원음 보관 여부·삭제·동의·보유 기간을 명확히 안내.</tspan><tspan x=\"122\" dy=\"42\">• 스크린리더 레이블, 모션 줄이기, 키보드 입력 경로 점검.</tspan><tspan x=\"122\" dy=\"42\">• 이름은 다시 말해 수정 가능하게 하고 과도한 의인화 방지.</tspan><tspan x=\"122\" dy=\"42\">현재: 브라우저 인식·규칙 기반 응답·기기 내 저장 데모.</tspan></text><rect x=\"1046\" y=\"625\" width=\"909\" height=\"420\" rx=\"10\" fill=\"#f5f5f7\" /><text x=\"1076\" y=\"671\" fill=\"#111111\" font-size=\"24\" font-weight=\"700\"><tspan x=\"1076\" dy=\"0\">유지한 익숙함 · 다음 확장</tspan></text><text x=\"1076\" y=\"722\" fill=\"#111111\" font-size=\"22\" font-weight=\"400\"><tspan x=\"1076\" dy=\"0\">• 이전·건너뛰기로 순서를 되돌리거나 선택을 미룸.</tspan><tspan x=\"1076\" dy=\"42\">• 2×2 선택지로 긴 답변 대신 익숙한 상황을 고름.</tspan><tspan x=\"1076\" dy=\"42\">• 누르고 말하기·다시 듣기·재시도로 조작을 반복.</tspan><tspan x=\"1076\" dy=\"42\">• 바꾼 것: 설문 중심의 시작을 캐릭터 대화로 전환.</tspan><tspan x=\"1076\" dy=\"42\">• 다음 확장: 주제 추천·난이도 조정·포인트로 돌봄.</tspan><tspan x=\"1076\" dy=\"42\">유지한 조작의 이해도와 7단계 길이를 함께 검증.</tspan></text></svg>"];
let slideNo=1;const maxSlides=docPages.length;
function showSlide(n){slideNo=Math.max(1,Math.min(maxSlides,n));document.getElementById('docSlide').innerHTML=docPages[slideNo-1];window.mountDocumentScreens?.(slideNo);document.getElementById('docSlide').setAttribute('aria-label','과제 문서 '+slideNo+'장');document.getElementById('docCount').textContent=slideNo+'/'+maxSlides;document.getElementById('docPrev').disabled=slideNo===1;document.getElementById('docNext').disabled=slideNo===maxSlides}
function syncSwitchIndicator(){
 const tabs=document.querySelector('.layout>.view-switch');
 const selected=tabs?.querySelector('.switch-btn.active');
 if(!selected)return;
 tabs.style.setProperty('--switch-left',selected.offsetLeft+'px');
 tabs.style.setProperty('--switch-width',selected.offsetWidth+'px');
}
window.addEventListener('resize',syncSwitchIndicator);
document.fonts.ready.then(syncSwitchIndicator);
requestAnimationFrame(syncSwitchIndicator);
function setView(view){
 const doc=view==='document',character=view==='character';
 if(doc||character){greetingVoice?.cancelHold();window.speechSynthesis?.cancel();}
 document.body.classList.toggle('doc-mode',doc);
 document.body.classList.toggle('character-mode',character);
 document.getElementById('documentView').hidden=!doc;
 const characterPage=document.getElementById('characterView');if(characterPage)characterPage.hidden=!character;
 for(const [id,selected] of [['viewPrototype',!doc&&!character],['viewDocument',doc],['viewCharacter',character]]){
  const tab=document.getElementById(id);tab.classList.toggle('active',selected);tab.setAttribute('aria-selected',String(selected));
 }
 syncSwitchIndicator();if(doc)showSlide(slideNo);
 if(character&&characterPage)characterPage.focus({preventScroll:true});
}
document.getElementById('viewPrototype').onclick=()=>setView('prototype');document.getElementById('viewDocument').onclick=()=>setView('document');document.getElementById('viewCharacter').onclick=()=>setView('character');document.getElementById('docPrev').onclick=()=>showSlide(slideNo-1);document.getElementById('docNext').onclick=()=>showSlide(slideNo+1);showSlide(1);
// Brand-first entrance; dismiss quickly when returning to the prototype from Document.
const launchSplash=document.getElementById('launchSplash');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobileView=window.matchMedia('(max-width:850px)').matches;
let launchRun=0,deviceArrival=null;
const launchPause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function playMontalkEntrance(){
 const side=document.querySelector('.side');side.classList.add('waiting-for-egg');
 side.classList.remove('presentation-enter','copy-ready');
 document.querySelector('.center-wrap').classList.remove('note-ready');
 const run=++launchRun,phone=document.querySelector('.phone'),device=document.querySelector('.device-shell');
 deviceArrival?.cancel();
 phone.classList.remove('entrance-revealing');phone.classList.add('entrance-pending');
 launchSplash.classList.remove('out');launchSplash.classList.add('logo-ready');
 revealViewSwitch();
 if(reducedMotion){phone.classList.remove('entrance-pending');launchSplash.classList.add('out');side.classList.remove('waiting-for-egg');animateMainCopy();document.querySelector('.center-wrap').classList.add('note-ready');return}
 if(!mobileView){
  deviceArrival=device.animate([{transform:'translateY('+140+'px)'},{transform:'translateY(0)'}],{duration:1250,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'});
  await deviceArrival.finished.catch(()=>{});
  if(run!==launchRun)return;
  deviceArrival.cancel();deviceArrival=null;
 }
 if(run!==launchRun)return;
 launchSplash.classList.add('logo-ready');
 await launchPause(900);
 if(run!==launchRun)return;
 phone.classList.remove('entrance-pending');phone.classList.add('entrance-revealing');
 startCameraEntrance();launchSplash.classList.add('out');animateScreenTitle();
 side.classList.remove('waiting-for-egg');
 animateMainCopy(()=>{if(run===launchRun&&document.getElementById('egg')&&data.step===0)document.querySelector('.center-wrap').classList.add('note-ready')});
 await launchPause(1900);
 if(run===launchRun)phone.classList.remove('entrance-revealing');
}
let introLeaving=false, introReady=false, introSequence=0;
let introAudio=null, soundOn=true, lastTick=0;
function enableIntroAudio(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return false;
  introAudio ||= new AC();
  if(introAudio.state==='suspended')introAudio.resume().catch(()=>{});
  return introAudio.state==='running';
 }catch(e){return false}
}
function tickSound(){
 if(!soundOn||!introAudio||introAudio.state!=='running')return;
 const t=introAudio.currentTime;
 if(t-lastTick<.075)return;
 lastTick=t;
 const osc=introAudio.createOscillator(),gain=introAudio.createGain();
 osc.type='triangle';osc.frequency.setValueAtTime(620+Math.random()*220,t);
 osc.frequency.exponentialRampToValueAtTime(390+Math.random()*100,t+.018);
 gain.gain.setValueAtTime(.0001,t);
 gain.gain.exponentialRampToValueAtTime(.006,t+.003);
 gain.gain.exponentialRampToValueAtTime(.0001,t+.026);
 osc.connect(gain).connect(introAudio.destination);osc.start(t);osc.stop(t+.03);
}
// Browser autoplay policy may suppress intro audio without prior user activation.
// No sound toggle is displayed; audio remains best-effort.
// All punctuation below is part of IBM Plex Mono's published glyph repertoire.
const introGlyphs='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#%&*+-=/?<>[]{}()!$^~:;|\\';
const introSleep=ms=>new Promise(r=>setTimeout(r,ms));
const introLines=[...document.querySelectorAll('.intro-line')];
const introName=document.getElementById('introName');
const introArrow=null; // Removed visual arrow; cover itself is the entry target.
const cover=document.getElementById('introCover');
const coverPhysics=new CoverPhysics(cover,document.getElementById('introEnter'));
const wipe=document.getElementById('introWipe');
const easeOut=p=>1-Math.pow(1-p,3);
const rand=()=>introGlyphs[Math.floor(Math.random()*introGlyphs.length)];
function scrambleTo(el,target,duration=1150,reverse=false,onProgress=null){
 const ticket=(el._scrambleTicket||0)+1;el._scrambleTicket=ticket;
 const chars=[...target];
 el.replaceChildren();
 // Preserve each character's own color state instead of recoloring the entire line.
 // The final green dot is a separate cursor and never participates in scrambling.
 const spans=chars.map(c=>{
  const node=document.createElement('span');node.className='glyph';
  node.textContent=c===' '?'\u00a0':c;
  el.appendChild(node);return node;
 });
 return new Promise(resolve=>{
  const start=performance.now();let last=-1;
  function frame(now){
   if(el._scrambleTicket!==ticket){resolve();return}
   const p=Math.min(1,(now-start)/duration),eased=easeOut(p);
   const bucket=Math.floor((now-start)/33);
   if(bucket!==last||p===1){
    last=bucket;
    if(!reverse&&p<1)tickSound();
    const count=Math.floor(eased*chars.length);
    onProgress?.(count/chars.length);
    spans.forEach((node,i)=>{
     const c=chars[i];
     if(c===' '){node.textContent='\u00a0';node.classList.add('resolved');return}
     const fixed=reverse?i>=chars.length-count:i<count;
     node.classList.toggle('resolved',fixed&&!reverse);
     node.textContent=fixed?(reverse?'\u00a0':c):rand();
    });
   }
   if(p<1)requestAnimationFrame(frame);
   else{
    spans.forEach((node,i)=>{node.textContent=reverse?'':(chars[i]===' '?'\u00a0':chars[i]);node.classList.toggle('resolved',!reverse)});
    resolve();
   }
  }
  requestAnimationFrame(frame);
 });
}
function attachDot(){
 const button=document.getElementById('introEnter');
 const style=getComputedStyle(introLines[2]);
 const context=document.createElement('canvas').getContext('2d');
 context.font=style.fontWeight+' '+style.fontSize+' '+style.fontFamily;
 button.style.marginLeft=(Math.max(0,-context.measureText('P').actualBoundingBoxLeft)+15)+'px';
 button.disabled=false;button.classList.add('ready');
}

function motion(el,frames,options){
 if(reducedMotion){el.style.transform='none';el.style.opacity='1';return Promise.resolve()}
 const anim=el.animate(frames,{fill:'both',...options});
 return anim.finished.catch(()=>{}).then(()=>{if(anim.playState!=='idle')anim.commitStyles?.();anim.cancel()});
}
function setIntroVisible(visible){
 coverPhysics.stop();
 document.body.classList.toggle('intro-playing',visible);
 cover.style.display=visible?'flex':'none';
 cover.style.opacity='1';
 cover.style.visibility='visible';
 cover.style.pointerEvents=visible?'auto':'none';
 wipe.style.display='';wipe.classList.remove('run');wipe.style.transition='none';wipe.style.transform='translateX(-101%)';wipe.style.opacity='1';
}
async function playIntro(){
 const sequence=++introSequence;
 if(mobileView){cover.remove();wipe.remove();document.body.classList.remove('intro-playing');resetOpeningStep();playMontalkEntrance();return}
 setIntroVisible(true);introLeaving=false;introReady=false;
 const entry=document.getElementById('introEnter');entry.disabled=true;entry.classList.remove('ready');
 
 for(const el of [...introLines,introName]){el._scrambleTicket=(el._scrambleTicket||0)+1;el.textContent='';el.classList.remove('is-arriving','is-rewinding','scrambling','dot-visible');el.style.opacity='1';el.style.transform='none';el.style.visibility='visible'}
 await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2200))]);
 if(sequence!==introSequence)return;
 if(reducedMotion){[...introLines,introName].forEach(el=>el.textContent=el.dataset.final);attachDot();introLines[2].classList.add('dot-visible');introReady=true;return}
 enableIntroAudio();
 // First resolve the opening line at the vertical center, preserving its x position.
 const first=introLines[0],bounds=first.getBoundingClientRect();
 const centerOffset=window.innerHeight/2-(bounds.top+bounds.height/2);
 first.style.transform='translate3d(0,'+centerOffset+'px,0)';
 first.classList.add('scrambling');
 coverPhysics.start();
 await scrambleTo(first,first.dataset.final,1400);
 first.classList.remove('scrambling');
 if(sequence!==introSequence)return;
 await introSleep(1600);
 if(sequence!==introSequence)return;
 const tasks=[motion(first,[
  {transform:'translate3d(0,'+centerOffset+'px,0)',opacity:1},
  {transform:'translate3d(0,0,0)',opacity:1}
 ],{duration:1000,easing:'cubic-bezier(.22,1,.36,1)'})];
 // The remaining lines decrypt as the first line reaches its original heading position.
 introLines.slice(1).forEach((el,i)=>tasks.push((async()=>{
  await introSleep(450+i*200);
  if(sequence!==introSequence)return;
  el.classList.add('scrambling');
  await scrambleTo(el,el.dataset.final,1100);
  el.classList.remove('scrambling');
 })()));
 tasks.push((async()=>{
  await introSleep(700);
  if(sequence!==introSequence)return;
  introName.classList.add('scrambling');
  await scrambleTo(introName,introName.dataset.final,1000);
  introName.classList.remove('scrambling');
 })());
 await Promise.all(tasks);
 if(sequence!==introSequence)return;
 // The final green cursor dot appears only after the last T is resolved.
 attachDot();introLines[2].classList.add('dot-visible');
 introReady=true;
}
// Arrow is a real IBM Plex Mono glyph; hover moves it slightly to the right.
function startCameraEntrance(){
 const stage=document.querySelector('#egg')?.closest('.stage');
 if(!stage||reducedMotion)return;
 stage.classList.remove('scene-camera-enter');
 void stage.offsetWidth;
 stage.classList.add('scene-camera-enter');
 const egg=document.getElementById('egg');
 if(egg){egg.style.setProperty('animation','none','important');void egg.offsetWidth;egg.style.removeProperty('animation')}
}
function showMain(){
 resetOpeningStep();
 window.speechSynthesis?.cancel();document.body.classList.remove('intro-playing');
 cover.style.display='none';

}
async function enterPrototype(){
 if(introLeaving||!introReady)return;
 introLeaving=true;introReady=false;
 coverPhysics.stop();
 const sequence=introSequence;
 const entry=document.getElementById('introEnter');entry.disabled=true;entry.classList.remove('ready');
 if(!history.state?.uxCover){history.replaceState({uxCover:true},'','#cover')}
 history.pushState({uxMain:true},'','#prototype');
 wipe.style.display='none';
 if(reducedMotion){showMain();return}
 const distance=window.innerWidth+100;
 const exits=introLines.map((el,i)=>motion(el,[
  {transform:'translateX(0)',opacity:1},
  {transform:'translateX(-'+distance+'px)',opacity:1}
 ],{duration:780,delay:i*200,easing:'cubic-bezier(.65,0,.35,1)'}).then(()=>{if(sequence===introSequence){el.style.visibility='hidden';el.style.opacity='0';el.style.transform='translateX(-'+distance+'px)'}}));
 exits.push(motion(introName,[{transform:'translateX(0)',opacity:1},{transform:'translateX(-'+distance+'px)',opacity:0}],{duration:700,delay:400,easing:'cubic-bezier(.65,0,.35,1)'}));
 await Promise.all(exits);
 if(sequence!==introSequence)return;
 for(const el of [...introLines,introName])el.style.visibility='hidden';
 const backdrop=cover.animate([{backgroundColor:'#fff'},{backgroundColor:'#f6f5f8'}],{duration:650,easing:'ease-in-out',fill:'both'});
 await backdrop.finished.catch(()=>{});
 if(sequence!==introSequence){backdrop.cancel();return}
 showMain();backdrop.cancel();
}

let mainCopySequence=0;
function animateMainCopy(onComplete=()=>{}){
 if(isDocumentPreview)return;
 const sequence=++mainCopySequence,brand=document.querySelector('.page-brand'),side=document.querySelector('.side');
 const titles=['Naver Healthcare','UX Design','Pre-Assignment'];
 brand.replaceChildren();
 const lines=titles.map(title=>{const line=document.createElement('span');line.className='brand-line';line.dataset.final=title;brand.appendChild(line);return line});
 const chapter=data.step===7?{title:'함께 자라기',english:'GROW TOGETHER',paragraphs:['영어 대화의 성취를 캐릭터 성장으로 연결.','대화로 모은 포인트로 먹이를 주고,<br>함께 놀며 다시 대화하고 싶은 관계 형성.']}:onboardingChapters[data.step];sideRenderedStep=data.step;
 side.querySelector('.eyebrow').textContent=chapter.english;
 const heading=side.querySelector('h1'),headingText=chapter.title;
 side.querySelector('.side-description').innerHTML=chapter.paragraphs.map(text=>'<p>'+text+'</p>').join('');
 syncChapterNavigation();
 heading.setAttribute('aria-label',headingText);
 side.classList.remove('presentation-enter','copy-ready');side.classList.add('copy-typing');
 heading.textContent='';void side.offsetWidth;side.classList.add('presentation-enter');
 if(reducedMotion){heading.textContent=headingText;side.classList.remove('copy-typing');side.classList.add('copy-ready');lines.forEach((line,i)=>line.textContent=titles[i]);onComplete();return}
 let typed=0;
 const typeNext=()=>{
  if(sequence!==mainCopySequence||document.body.classList.contains('intro-playing'))return;
  heading.textContent=headingText.slice(0,++typed);
  if(typed<headingText.length)setTimeout(typeNext,70);
  else{
   const description=side.querySelector('.side-description');let completed=false;
   const complete=()=>{if(completed)return;completed=true;description.removeEventListener('animationend',ended);if(sequence===mainCopySequence)onComplete()};
   const ended=event=>{if(event.target===description&&event.animationName==='description-rise')complete()};
   description.addEventListener('animationend',ended);
   side.classList.remove('copy-typing');side.classList.add('copy-ready');
   // Hidden responsive copy has no animation events.
   setTimeout(complete,1100);
  }
 };
 setTimeout(typeNext,180);
 lines.forEach((line,i)=>{line.textContent=titles[i]});
}
