<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="3장 핵심 흐름" style="font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><rect width="2048" height="1152" fill="#fff"/><image href="img/naver-logo.png" x="1861" y="58" width="94" height="19"/><path d="M89 103H1958" stroke="#c9d2d9" stroke-width="1.6"/><text x="92" y="80" fill="#202b35" font-size="40" font-weight="700"><tspan x="92" dy="0">3장  핵심 흐름</tspan></text><text x="89" y="161" fill="#111111" font-size="24" font-weight="700"><tspan x="89" dy="0">익숙한 조작은 그대로 / 설정을 마치는 온보딩에서 첫 영어 한마디를 경험하는 온보딩으로</tspan></text><rect x="89.0" y="223" width="341" height="250" rx="32" fill="#f5f5f7"/><text x="121.0" y="283" fill="#111111" font-size="23" font-weight="700"><tspan x="121.0" dy="0">1. 안녕 작은 친구</tspan></text><text x="121.0" y="389" fill="#111111" font-size="22" font-weight="400"><tspan x="121.0" dy="0">알을 터치해 캐릭터를</tspan><tspan x="121.0" dy="32">깨우고 첫 상호작용 시작</tspan></text><path d="M430.0 348H456.0" stroke="#202b35" stroke-width="1.6"/><path d="M455.0 343L464.0 348L455.0 353Z" fill="#202b35"/><rect x="471.25" y="223" width="341" height="250" rx="32" fill="#f5f5f7"/><text x="503.25" y="283" fill="#111111" font-size="23" font-weight="700"><tspan x="503.25" dy="0">2. 목소리로 안녕</tspan></text><text x="503.25" y="389" fill="#111111" font-size="22" font-weight="400"><tspan x="503.25" dy="0">같은 발화 버튼으로 인사하며</tspan><tspan x="503.25" dy="32">누르고 말하는 조작을 익힘</tspan></text><path d="M812.25 348H838.25" stroke="#202b35" stroke-width="1.6"/><path d="M837.25 343L846.25 348L837.25 353Z" fill="#202b35"/><rect x="853.5" y="223" width="341" height="250" rx="32" fill="#f5f5f7"/><text x="885.5" y="283" fill="#111111" font-size="23" font-weight="700"><tspan x="885.5" dy="0">3. 서로 알아가기</tspan></text><text x="885.5" y="389" fill="#111111" font-size="22" font-weight="400"><tspan x="885.5" dy="0">이름은 목소리로 답하고</tspan><tspan x="885.5" dy="32">목적 / 수준은 선택지로 응답</tspan></text><path d="M1194.5 348H1220.5" stroke="#202b35" stroke-width="1.6"/><path d="M1219.5 343L1228.5 348L1219.5 353Z" fill="#202b35"/><rect x="1235.75" y="223" width="341" height="250" rx="32" fill="#f5f5f7"/><text x="1267.75" y="283" fill="#111111" font-size="23" font-weight="700"><tspan x="1267.75" dy="0">4. 첫 영어 발화</tspan></text><text x="1267.75" y="389" fill="#111111" font-size="22" font-weight="400"><tspan x="1267.75" dy="0">쉬운 영어 인사 한 문장을 말하고</tspan><tspan x="1267.75" dy="32">인식 확인과 재시도로 첫 이용</tspan></text><path d="M1576.75 348H1602.75" stroke="#202b35" stroke-width="1.6"/><path d="M1601.75 343L1610.75 348L1601.75 353Z" fill="#202b35"/><rect x="1618.0" y="223" width="341" height="250" rx="32" fill="#f5f5f7"/><text x="1650.0" y="283" fill="#111111" font-size="23" font-weight="700"><tspan x="1650.0" dy="0">5. 홈 진입</tspan></text><text x="1650.0" y="389" fill="#111111" font-size="22" font-weight="400"><tspan x="1650.0" dy="0">첫 발화를 축하한 뒤 홈으로</tspan><tspan x="1650.0" dy="32">같은 버튼으로 다음 대화 시작</tspan></text><text x="89" y="584" fill="#111111" font-size="24" font-weight="700"><tspan x="89" dy="0">유지한 익숙함과 새롭게 제안한 경험</tspan></text><rect x="89" y="639" width="906" height="360" rx="32" fill="#f5f5f7"/><rect x="1052" y="639" width="906" height="360" rx="32" fill="#f5f5f7"/><text x="121" y="699" fill="#111111" font-size="23" font-weight="700"><tspan x="121" dy="0">그대로 둔 조작</tspan></text><text x="121" y="786" fill="#111111" font-size="22" font-weight="400"><tspan x="121" dy="0">•   시작 버튼과 탭으로 행동 시작</tspan><tspan x="121" dy="47">•   이전 / 건너뛰기로 진행 속도 조절</tspan><tspan x="121" dy="47">•   2×2 선택지로 목적과 수준 선택</tspan><tspan x="121" dy="47">•   같은 발화 버튼으로 반복 응답</tspan></text><text x="1084" y="699" fill="#111111" font-size="23" font-weight="700"><tspan x="1084" dy="0">새롭게 연결한 경험</tspan></text><text x="1084" y="786" fill="#111111" font-size="22" font-weight="400"><tspan x="1084" dy="0">•   알을 깨우며 친구와 첫 만남</tspan><tspan x="1084" dy="47">•   대화 속에서 이름 정보 수집</tspan><tspan x="1084" dy="47">•   몸짓으로 듣기 / 다음 행동 안내</tspan><tspan x="1084" dy="47">•   설정 완료보다 첫 영어 발화 축하</tspan></text><path d="M1460 836H1528" stroke="#202b35" stroke-width="1.6"/><path d="M1527 831L1536 836L1527 841Z" fill="#202b35"/><text x="1564" y="829" fill="#111111" font-size="24" font-weight="700"><tspan x="1564" dy="0">온보딩의 완료 기준은</tspan><tspan x="1564" dy="37">첫 영어 한마디의 경험</tspan></text><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><text x="1928" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="1928" dy="0">3</tspan></text></svg>