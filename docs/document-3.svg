<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-label="3장  핵심 흐름" style="font-family:Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><rect x="0" y="0" width="2048" height="1152" fill="#fff"/><image href="img/naver-logo.png" x="1861" y="58" width="94" height="19" preserveAspectRatio="xMidYMid meet"/><text x="92" y="80" fill="#202b35" font-size="40" font-weight="700"><tspan x="92" dy="0">3장  핵심 흐름</tspan></text><path d="M89 103 H1958" stroke="#c9d2d9" stroke-width="1.6"/><text x="92" y="147" fill="#63717c" font-size="28" font-weight="400"><tspan x="92" dy="0">시작부터 끝까지의 사용자 흐름을 담아 주세요.</tspan></text><text x="92" y="1104" fill="#63717c" font-size="22" font-weight="400"><tspan x="92" dy="0">헬스케어 프로덕트 UX 디자인 사전 과제  ·  답안 양식</tspan></text><text x="92" y="218" fill="#215e50" font-size="29" font-weight="600"><tspan x="92" dy="0">설계 목표  |  설명보다 첫 행동, 평가보다 쉬운 발화로 서비스 가치 체험</tspan></text><rect x="92" y="272" width="246" height="178" rx="14" fill="#f5f5f7"/><text x="110" y="312" fill="#215e50" font-size="25" font-weight="600"><tspan x="110" dy="0">01 첫 만남</tspan></text><text x="110" y="360" fill="#215e50" font-size="19" font-weight="400"><tspan x="110" dy="0">알을 톡톡 두드림</tspan><tspan x="110" dy="33">탐색·호기심</tspan></text><path d="M339 361h20m-7-6 7 6-7 6" fill="none" stroke="#215e50" stroke-width="2"/><rect x="361" y="272" width="246" height="178" rx="14" fill="#f5f5f7"/><text x="379" y="312" fill="#215e50" font-size="25" font-weight="600"><tspan x="379" dy="0">02 인사 나누기</tspan></text><text x="379" y="360" fill="#215e50" font-size="19" font-weight="400"><tspan x="379" dy="0">버튼을 꾹 누르고 인사</tspan><tspan x="379" dy="33">발화 방식 학습</tspan></text><path d="M608 361h20m-7-6 7 6-7 6" fill="none" stroke="#215e50" stroke-width="2"/><rect x="630" y="272" width="246" height="178" rx="14" fill="#f5f5f7"/><text x="648" y="312" fill="#215e50" font-size="25" font-weight="600"><tspan x="648" dy="0">03 서로 알아가기</tspan></text><text x="648" y="360" fill="#215e50" font-size="19" font-weight="400"><tspan x="648" dy="0">음성으로 이름 전달</tspan><tspan x="648" dy="33">개인화 시작</tspan></text><path d="M877 361h20m-7-6 7 6-7 6" fill="none" stroke="#215e50" stroke-width="2"/><rect x="899" y="272" width="246" height="178" rx="14" fill="#f5f5f7"/><text x="917" y="312" fill="#215e50" font-size="25" font-weight="600"><tspan x="917" dy="0">04 목표 찾기</tspan></text><text x="917" y="360" fill="#215e50" font-size="19" font-weight="400"><tspan x="917" dy="0">관심 상황 하나 선택</tspan><tspan x="917" dy="33">관심 상황 파악</tspan></text><path d="M1146 361h20m-7-6 7 6-7 6" fill="none" stroke="#215e50" stroke-width="2"/><rect x="1168" y="272" width="246" height="178" rx="14" fill="#f5f5f7"/><text x="1186" y="312" fill="#215e50" font-size="25" font-weight="600"><tspan x="1186" dy="0">05 출발점 맞추기</tspan></text><text x="1186" y="360" fill="#215e50" font-size="19" font-weight="400"><tspan x="1186" dy="0">체감 영어 수준 선택</tspan><tspan x="1186" dy="33">평가 대신 자기보고</tspan></text><path d="M1415 361h20m-7-6 7 6-7 6" fill="none" stroke="#215e50" stroke-width="2"/><rect x="1437" y="272" width="246" height="178" rx="14" fill="#f5f5f7"/><text x="1455" y="312" fill="#215e50" font-size="25" font-weight="600"><tspan x="1455" dy="0">06 첫 대화</tspan></text><text x="1455" y="360" fill="#215e50" font-size="19" font-weight="400"><tspan x="1455" dy="0">쉬운 영어 인사 따라 말함</tspan><tspan x="1455" dy="33">핵심 가치 체험</tspan></text><path d="M1684 361h20m-7-6 7 6-7 6" fill="none" stroke="#215e50" stroke-width="2"/><rect x="1706" y="272" width="246" height="178" rx="14" fill="#f5f5f7"/><text x="1724" y="312" fill="#215e50" font-size="25" font-weight="600"><tspan x="1724" dy="0">07 작은 성취</tspan></text><text x="1724" y="360" fill="#215e50" font-size="19" font-weight="400"><tspan x="1724" dy="0">Nice! · 첫 영어 +20P</tspan><tspan x="1724" dy="33">홈으로 연결</tspan></text><text x="92" y="515" fill="#215e50" font-size="27" font-weight="600"><tspan x="92" dy="0">음성 입력의 공통 분기</tspan></text><rect x="92" y="550" width="590" height="184" rx="12" fill="#f5f5f7"/><text x="116" y="590" fill="#215e50" font-size="25" font-weight="600"><tspan x="116" dy="0">기다리는 중</tspan></text><text x="116" y="632" fill="#215e50" font-size="21" font-weight="400"><tspan x="116" dy="0">2단계에서 일정 시간 무동작</tspan><tspan x="116" dy="31">→ sit 자세와 Here!로 버튼 위치 안내</tspan><tspan x="116" dy="31">→ 최초 마이크 사용 이후 반복 안내 생략</tspan></text><rect x="728" y="550" width="590" height="184" rx="12" fill="#f5f5f7"/><text x="752" y="590" fill="#215e50" font-size="25" font-weight="600"><tspan x="752" dy="0">누르고 있는 동안</tspan></text><text x="752" y="632" fill="#215e50" font-size="21" font-weight="400"><tspan x="752" dy="0">마이크 권한 확인 후 듣기 상태 진입</tspan><tspan x="752" dy="31">→ 캐릭터가 가까이 다가오고 버튼 확장</tspan><tspan x="752" dy="31">→ 발화 문장은 뒤쪽에서 오른쪽 → 왼쪽 이동</tspan></text><rect x="1364" y="550" width="590" height="184" rx="12" fill="#f5f5f7"/><text x="1388" y="590" fill="#215e50" font-size="25" font-weight="600"><tspan x="1388" dy="0">손을 뗀 뒤</tspan></text><text x="1388" y="632" fill="#215e50" font-size="21" font-weight="400"><tspan x="1388" dy="0">이해함 → 인사 응답 / 이름 저장 / 영어 완료</tspan><tspan x="1388" dy="31">못 들음 → sad 자세와 재시도 타이틀</tspan><tspan x="1388" dy="31">권한 거부·미지원 → 대안 입력 후속 구현</tspan></text><path d="M215 450v44H1955M997 450v44M1780 450v44" fill="none" stroke="#a6c5bb" stroke-width="2"/><rect x="92" y="782" width="1864" height="255" rx="12" fill="#f5f5f7"/><text x="122" y="825" fill="#215e50" font-size="27" font-weight="600"><tspan x="122" dy="0">서비스 규칙과 예외</tspan></text><text x="122" y="870" fill="#215e50" font-size="23" font-weight="400"><tspan x="122" dy="0">목표·수준·첫 영어 단계는 건너뛰기 가능. 이전 버튼으로 앞 단계 재확인.</tspan><tspan x="122" dy="38">영어 대화만 포인트 적립: 첫 성공 +20P, 이후 영어 대화 +10P. 한국어 인사·이름에는 보상 없음.</tspan><tspan x="122" dy="38">발화 인식 실패 시 단계·입력 맥락 유지 후 다시 시도. 홈에서 대화로 포인트를 계속 쌓음.</tspan><tspan x="122" dy="38">현재 프로토타입은 문자 패턴으로 영어 여부를 판별함. 실제 의미 이해·발음 평가·서버 저장은 후속 구현.</tspan></text></svg>